# Read by AWX. AWX runs ansible-playbook from the project root, and Ansible only picks up an
# ansible.cfg from the working directory — so playbooks/ansible.cfg (which Spacelift reaches through
# ANSIBLE_CONFIG) never applied to AWX jobs, and they ran on Ansible's defaults.
#
# Deliberately minimal: only what AWX jobs need that the defaults lack. Everything else stays at
# the defaults AWX has always run with.
#
# ServerAlive*: notice a dead connection in ~2 minutes instead of never. On 2026-10-02 an upgrade
# restarted sshd on k8s-west-master-2 mid-task, the result never arrived, and job 3987 hung for 51
# minutes until cancelled. The ControlMaster/ControlPersist values are Ansible's own defaults,
# repeated because setting ssh_args replaces them.
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
