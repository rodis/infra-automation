---
# Standalone entry point for the openstack_dead_ports role.
#
# Registered in AWX as [65] General: OpenStack: Remove dead ports. The logic lives in
# roles/openstack_dead_ports so that a playbook which CREATES machines can include it inline —
# clearing dead ports is part of building an instance, not a separate errand somebody remembers.
# See that role's README for what it does and why.
#
#   Report:  dry_run=true                       (a read; needs no authority)
#   Fix:     dry_run=false
#            authorizing_objective=cluster-build
#            granted_actions=['openstack.port.delete']
#
# The role is referenced by relative path rather than by name. Ansible resolves role names against
# the playbook's own directory and the configured roles_path, and this repo has no ansible.cfg at
# the root that AWX would load — adding one would newly apply the ssh settings in
# playbooks/ansible.cfg, which is a behaviour change that has no business riding along with a
# refactor. An explicit path needs no configuration and cannot be resolved to the wrong thing.
#
# `dry_run` is kept as the external name so the AWX template's existing interface is unchanged; it
# is mapped onto the role's prefixed variable here, at the boundary.

- name: Find and optionally remove dead Neutron ports
  hosts: all
  gather_facts: false
  connection: local

  roles:
    - role: ../../roles/openstack_dead_ports
      openstack_dead_ports_dry_run: "{{ dry_run | default(true) }}"
      openstack_dead_ports_reachability_timeout: "{{ reachability_timeout | default(240) }}"
