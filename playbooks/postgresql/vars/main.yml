postgresql_databases:
  - name: "{{ lookup('env', 'DB_NAME') }}"
postgresql_users:
  - name: "{{ lookup('env', 'DB_USER') }}"
    password: "{{ lookup('env', 'DB_PASSWORD') }}"
postgresql_python_library: python3-psycopg2
postgresql_global_config_options:
  - option: unix_socket_directories
    value: '{{ postgresql_unix_socket_directories | join(",") }}'
  - option: log_directory
    value: 'log'
  - option: listen_addresses
    value: '*'
  # Raised from PostgreSQL's default of 100 on 2026-08-23, after AWX exhausted it and its web UI
  # began dropping requests. With superuser_reserved_connections at 3, the usable ceiling was 97 and
  # AWX was sitting at 95 -- 91 of them idle, 1 active, so this is connection HOARDING rather than
  # load. 59 belonged to wsrelay, which meshes between awx-task pods and therefore grows with the
  # square of task_replicas (6 today); eight pods would need roughly 140.
  #
  # A connection pooler is not an alternative here: PgBouncer transaction mode is the only mode that
  # reduces connections and it breaks both LISTEN/NOTIFY and session advisory locks, which AWX uses
  # (13 backends holding channels, pg_advisory_unlock on 14). Session mode is 1:1 and saves nothing.
  #
  # 200, not 300: it covers a replica bump with room to spare at a few MB of baseline each, against
  # 7GB free on an 8GB VM. shared_buffers is deliberately NOT touched in the same change -- the
  # cache hit ratio measured 100%, so the working set already fits the default 128MB and raising it
  # would spend RAM on a problem that does not exist.
  #
  # CHANGING THIS REQUIRES A POSTGRESQL RESTART, which briefly drops every AWX connection.
  - option: max_connections
    value: 200
  # Only FAILED logins are logged by default, which is exactly backwards for the question that
  # matters. On 2026-08-23 we could count 138 rejected attempts precisely because they failed --
  # and had one of them succeeded there would have been no record of it at all. An allowlist is
  # only as good as the ability to notice it being defeated.
  #
  # log_disconnections is deliberately NOT enabled: it roughly doubles the line count for an
  # estate whose logs now ship to a 50GB/month allowance, and answers a question nobody is asking.
  - option: log_connections
    value: 'on'
postgresql_hba_entries:
  - {type: local, database: all, user: postgres, auth_method: peer}
  - {type: local, database: all, user: all, auth_method: peer}
  - {type: host, database: all, user: all, address: '127.0.0.1/32', auth_method: "{{ postgresql_auth_method }}"}
  - {type: host, database: all, user: all, address: '::1/128', auth_method: "{{ postgresql_auth_method }}"}
  # WAS 0.0.0.0/0. PostgreSQL listens on a public address because OpenStack networking here breaks
  # private networks the moment a floating IP is attached, so every service on these machines is
  # internet-facing whether it wants to be or not. On 2026-08-23 that produced 138 rejected logins
  # in one day from five source addresses, guessing `postgres`, `wog` and `pgg_superadmins` -- and
  # the only thing between the internet and the AWX database was the strength of one password.
  #
  # Filtering by network is not an option: the provider's public range is large and not ours to
  # predict. What IS stable is the cluster -- three nodes, public IPs assigned directly to the
  # machines rather than floated, and not autoscaled. So the allowlist is those three hosts.
  #
  # Verified before narrowing, rather than assumed: pg_stat_activity showed AWX connecting from
  # 208.113.135.15 and 208.113.130.17, the two worker nodes, SNAT'd to the node address. master-1
  # is included even though it currently connects from nowhere -- it carries the control-plane
  # taint so no AWX pod schedules there today, and leaving it out would turn a future scheduling
  # change into a database outage.
  #
  # What this list is coupled to, precisely, because "rebuilt" is ambiguous and the difference
  # decides whether the coupling is safe:
  #
  #   openstack server rebuild   keeps the instance UUID and its PORTS, so the address survives --
  #                              it swaps the disk image inside the same envelope.  Harmless here.
  #   destroy and recreate       new instance, new port, new address.  This list goes stale and AWX
  #     (terraform -replace)     loses its database until somebody updates it.
  #
  # THE PREMISE THAT MADE THE SECOND CASE SAFE IS GONE, AND IT COST AN OUTAGE (2026-10-15).
  # This comment used to argue that hardcoding addresses is defensible in `south` because rule 7
  # forbids destroying a VM there on any occasion, so the invalidating operation could not happen.
  # The owner then granted a bounded exception for the three-masters project (task vault:
  # south-three-masters) and south's workers were destroyed and replaced by control-plane nodes.
  # k8s-south-master-2 came up on a NEW address, was not on this list, and every AWX pod scheduled
  # there connected, was refused at authentication, and hung in `wait-for-migrations` forever --
  # 25 minutes of AWX 503 before the pods were moved back. Had the last allowlisted worker been
  # destroyed first, AWX could not have come back at all, and AWX is the hands for every cluster.
  #
  # So the rule is now explicit rather than implied: THIS LIST IS PART OF ADDING OR REPLACING A
  # SOUTH MACHINE. Add the new address here and apply this stack BEFORE any AWX pod can schedule
  # on it -- in practice, between Terraform creating the instance and the node being made
  # schedulable. A node that is Ready and untainted but missing from this list is a trap that
  # presents as a hanging pod with no error anywhere.
  #
  # Removed 2026-10-15: 208.113.130.17, which was k8s-south-node-2, destroyed that day. Addresses
  # here are public and are returned to the provider's pool, so a stale entry is not merely
  # untidy -- it can come to name a machine belonging to somebody else, and as this file notes
  # above, the only thing between the internet and the AWX database is one password.
  #
  # k8s-south-master-3 was added 2026-10-16 at 208.113.130.241. Note that this is its SECOND
  # address: the first instance came up with the two-IPv4 fault and was replaced with
  # `terraform apply -replace`, which gave it a new port and a new address. A replacement inside a
  # build changes this list too -- the coupling is to the ADDRESS, not to the role or the name.
  #
  # Do not copy this pattern to west, east or north. Those tenants are rebuilt routinely, by
  # design, and an allowlist of instance addresses there would be a trap rather than a control.
  - {type: host, database: "{{ lookup('env', 'DB_NAME') }}", user: "{{ lookup('env', 'DB_USER') }}", address: '208.113.131.96/32', auth_method: "{{ postgresql_auth_method }}"}  # k8s-south-master-1
  - {type: host, database: "{{ lookup('env', 'DB_NAME') }}", user: "{{ lookup('env', 'DB_USER') }}", address: '208.113.130.50/32', auth_method: "{{ postgresql_auth_method }}"}  # k8s-south-master-2
  - {type: host, database: "{{ lookup('env', 'DB_NAME') }}", user: "{{ lookup('env', 'DB_USER') }}", address: '208.113.130.241/32', auth_method: "{{ postgresql_auth_method }}"}  # k8s-south-master-3
postgresql_privs:
  - db: "{{ lookup('env', 'DB_NAME') }}"
    roles: "{{ lookup('env', 'DB_USER') }}"
    privs: ALL
    type: database
  - db: "{{ lookup('env', 'DB_NAME') }}"
    roles: "{{ lookup('env', 'DB_USER') }}"
    privs: ALL
    type: schema
    objs: public
# TRUE. This was false, which disables Ansible's redaction on the task that handles
# DB_PASSWORD -- so every run printed the AWX database password into the Spacelift log,
# where it persists in the run history. Debugging a password is not worth publishing one.
postgres_users_no_log: true
