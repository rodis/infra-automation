---
# Put south's etcd timings where a joining master will inherit them (owner approved 2026-10-15).
#
# WHY THIS EXISTS AND etcd_tuning.yml IS NOT ENOUGH. etcd_tuning.yml (2026-08-24) set
# --backend-batch-interval by editing master-1's static-pod manifest directly, and the kubeadm-config
# ConfigMap knows nothing about it. That was fine for a one-member cluster and is a trap for a
# three-member one: a joining control-plane node's etcd manifest is GENERATED BY KUBEADM FROM
# kubeadm-config, so a member joined today would come up with no batch interval and with kubeadm's
# default timings -- heartbeat 100ms, election 1000ms -- while master-1 ran different ones. etcd's
# own tuning guide says every member must use the same timings; mismatched ones are invisible until
# the first stall, and then they are a leader-election storm. Surveyed 2026-10-15: master-1 has
# neither --heartbeat-interval nor --election-timeout, i.e. it is on the 1s default today.
#
# WHY THESE NUMBERS. The storage under every cluster here freezes for tens of seconds (vault tasks
# etcd-volume-fsync-probe, etcd-stacked-on-masters). A 1s election timeout against that is permanent
# leader churn once there is more than one voter. 15s is what development has run since 2026-10-03;
# it held through a measured 13.6s leader stall. 250ms heartbeat keeps the 60:1 ratio etcd wants.
# --backend-batch-interval=500ms is carried over unchanged from etcd_tuning.yml: it amortises more
# writes into each fsync, which is the right trade against storage whose problem is per-operation
# latency rather than throughput.
#
# WHAT IT DOES, in this order:
#   1. writes etcd.local.extraArgs into kubeadm-config -- no restart, and the half that actually
#      matters, because it is what every FUTURE member is generated from;
#   2. edits master-1's running manifest to match -- this restarts etcd;
#   3. asserts the two agree, which is the property the whole thing exists for.
#
# WHY IT EDITS THE MANIFEST RATHER THAN REGENERATING IT. `kubeadm init phase etcd local` would
# rewrite master-1's manifest from kubeadm-config and give maximum consistency with the members
# joined later. It is also a full rewrite of the static pod of the management plane's ONLY etcd
# member, where a smaller diff is worth more than a tidier one. So the three flags are edited in
# place, on a CANDIDATE copy outside the manifests directory that is parsed and checked before it is
# moved in -- a broken manifest means kubelet never starts etcd at all. What kubeadm WOULD have
# generated is printed as a report each run (see the last task), not graded.
#
# THE OUTAGE: etcd restarts. Measured on 2026-10-09 for the volume move: about 2 minutes, most of it
# kubelet restarting the static pod. Running pods keep running; every leader-elected controller
# exits once and comes back, as it does in every stall today. AWX's UI may error meanwhile.
#
# HOW TO RUN IT. A Spacelift TASK on "Ansible: south: Install Kube", like etcd_volume.yml:
#
#   spacectl stack task --id emoji-gear-ansible-install-kubernetes-on-dev-cluster --tail \
#     "chmod 600 /mnt/workspace/key; ansible-playbook etcd_timings.yml \
#      --limit k8s-south-master-1 \
#      --ssh-extra-args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"
#
# Re-running is safe: if both the ConfigMap and the manifest already carry these values it verifies
# and changes nothing, and etcd is not restarted.
#
# ROLLBACK is automatic: the manifest and the ConfigMap are restored from /var/backups/etcd-timings/.

- name: Set etcd timings in kubeadm-config and on the running member
  hosts: "{{ etcd_timings_hosts | default('kube_control_plane') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    etcd_timings:
      heartbeat-interval: "250"
      election-timeout: "15000"
      backend-batch-interval: "500ms"
    etcd_manifest: /etc/kubernetes/manifests/etcd.yaml
    etcd_candidate: /etc/kubernetes/etcd.yaml.candidate
    etcd_backup: /var/backups/etcd-timings
    etcd_snapshot: /var/backups/etcd-pre-timings.db
    etcd_health_url: http://127.0.0.1:2381/health
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
    etcdctl_env: >-
      --cacert=/etc/kubernetes/pki/etcd/ca.crt
      --cert=/etc/kubernetes/pki/etcd/server.crt
      --key=/etc/kubernetes/pki/etcd/server.key

  tasks:

    - name: etcd's own rule -- election timeout must be at least 5x the heartbeat
      # etcd refuses to start otherwise, which on a static pod is a crash loop rather than an error
      # message anyone sees. Cheaper to catch here than at 03:00.
      ansible.builtin.assert:
        that:
          - (etcd_timings['election-timeout'] | int) >= 5 * (etcd_timings['heartbeat-interval'] | int)
          - (etcd_timings['election-timeout'] | int) <= 50000
        fail_msg: >-
          election-timeout {{ etcd_timings['election-timeout'] }} is not a legal partner for
          heartbeat-interval {{ etcd_timings['heartbeat-interval'] }}.

    # ------------------------------------------------------------------ preflight: reads only

    - name: Read the live kubeadm-config
      ansible.builtin.command: >-
        {{ kubectl }} -n kube-system get cm kubeadm-config
        -o jsonpath={.data.ClusterConfiguration}
      register: et_cc_raw
      changed_when: false
      check_mode: false

    - name: Parse it
      ansible.builtin.set_fact:
        et_cc: "{{ et_cc_raw.stdout | from_yaml }}"

    - name: It must be v1beta4, whose extraArgs is a LIST of name/value pairs
      # v1beta3 used a map. Writing the wrong shape would be accepted by the ConfigMap and rejected
      # by kubeadm at the first join, which is the worst possible moment to find out.
      ansible.builtin.assert:
        that: et_cc.apiVersion == 'kubeadm.k8s.io/v1beta4'
        fail_msg: "kubeadm-config is {{ et_cc.apiVersion }}; this playbook writes v1beta4 extraArgs."

    - name: Read the current etcd manifest
      ansible.builtin.slurp:
        src: "{{ etcd_manifest }}"
      register: et_manifest_raw

    - name: Work out what the manifest says now
      ansible.builtin.set_fact:
        et_manifest_text: "{{ et_manifest_raw.content | b64decode }}"
        et_wanted_args: "{{ etcd_timings.keys() | list | zip(etcd_timings.values() | list)
                            | map('join', '=') | map('regex_replace', '^', '--') | list }}"

    - name: etcd is healthy before we restart it
      ansible.builtin.uri:
        url: "{{ etcd_health_url }}"
        return_content: true
      register: et_health_pre
      failed_when: "'\"health\":\"true\"' not in (et_health_pre.content | replace(' ', ''))"
      check_mode: false

    - name: Record the raft index before the restart
      # A restart that loses data would come back with a LOWER index. Graded after.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          C=$(crictl ps --name '^etcd$' --state running -q) &&
          crictl exec "$C" etcdctl --endpoints=https://127.0.0.1:2379 {{ etcdctl_env }}
          endpoint status -w json 2>/dev/null
          | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Status"]["raftIndex"])'
        executable: /bin/bash
      register: et_raft_pre
      changed_when: false
      check_mode: false

    - name: Record the running etcd container id
      # The only honest proof the restart happened. "etcd is healthy" is true of an etcd that never
      # restarted and still has the old flags.
      ansible.builtin.command: crictl ps --name '^etcd$' --state running -q
      register: et_cid_pre
      changed_when: false
      check_mode: false

    - name: Every node is Ready before we start
      ansible.builtin.shell:
        cmd: "{{ kubectl }} get nodes --no-headers | awk '$2 != \"Ready\" {print $1}'"
      register: et_nodes_pre
      changed_when: false
      check_mode: false
      failed_when: et_nodes_pre.stdout | trim | length > 0

    - name: Does the manifest already carry every wanted flag, and does the ConfigMap?
      # Done in Python, deliberately. The Jinja version of this was a chain of map/select/reject
      # filters, and the first draft of it had `map('regex_search', text)` -- which passes the
      # pattern as the value and the text as the pattern, so it silently answered "no flags found"
      # whatever the manifest said. A wrong answer here is not a crash: it decides whether etcd gets
      # restarted at all. This repo's own warning that a bug in the grading code looks exactly like
      # a finding (CLAUDE.md, rule 8) applies to idempotency checks too.
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys, yaml
            want = json.loads(sys.argv[1])
            manifest = yaml.safe_load(open(sys.argv[2]))
            cc = yaml.safe_load(sys.argv[3])
            cmd = manifest["spec"]["containers"][0]["command"]
            have = dict(a[2:].split("=", 1) for a in cmd if a.startswith("--") and "=" in a)
            extra = (cc.get("etcd") or {}).get("local", {}).get("extraArgs") or []
            cc_have = {e["name"]: str(e["value"]) for e in extra}
            print(json.dumps({
                "manifest_ok": all(have.get(k) == v for k, v in want.items()),
                "cc_ok": all(cc_have.get(k) == v for k, v in want.items()),
                "manifest_now": {k: have.get(k) for k in want},
                "cc_now": {k: cc_have.get(k) for k in want},
            }))
          - "{{ etcd_timings | to_json }}"
          - "{{ etcd_manifest }}"
          - "{{ et_cc_raw.stdout }}"
      register: et_state
      changed_when: false
      check_mode: false

    - name: Read that answer
      ansible.builtin.set_fact:
        et_manifest_ok: "{{ (et_state.stdout | from_json).manifest_ok }}"
        et_cc_ok: "{{ (et_state.stdout | from_json).cc_ok }}"

    - name: Say what is there now
      ansible.builtin.debug:
        msg:
          - "manifest: {{ (et_state.stdout | from_json).manifest_now }}"
          - "kubeadm-config: {{ (et_state.stdout | from_json).cc_now }}"
          - "wanted: {{ etcd_timings }}"

    - name: Already done -- verify and stop here
      when: et_manifest_ok | bool and et_cc_ok | bool
      block:
        - name: Nothing to do
          ansible.builtin.debug:
            msg: >-
              The manifest and kubeadm-config both already carry {{ et_wanted_args | join(' ') }}.
              etcd not restarted.
        - name: End
          ansible.builtin.meta: end_host

    # ------------------------------------------------------------------ backup, then change

    - name: Create the backup directory
      ansible.builtin.file:
        path: "{{ etcd_backup }}"
        state: directory
        mode: "0700"

    - name: Back up the manifest
      ansible.builtin.copy:
        src: "{{ etcd_manifest }}"
        dest: "{{ etcd_backup }}/etcd.yaml"
        remote_src: true
        mode: preserve
        force: false

    - name: Back up kubeadm-config's ClusterConfiguration VALUE
      # The value, not a `get -o yaml` dump: a dump carries a resourceVersion and restoring it with
      # `kubectl apply` can conflict. Restoring one key by merge patch cannot.
      ansible.builtin.shell:
        cmd: >-
          {{ kubectl }} -n kube-system get cm kubeadm-config
          -o jsonpath={.data.ClusterConfiguration} > {{ etcd_backup }}/ClusterConfiguration.yaml
        creates: "{{ etcd_backup }}/ClusterConfiguration.yaml"

    - name: The backup is not empty
      ansible.builtin.stat:
        path: "{{ etcd_backup }}/ClusterConfiguration.yaml"
      register: et_bk
      failed_when: not et_bk.stat.exists or et_bk.stat.size < 50

    - name: Snapshot etcd
      ansible.builtin.shell:
        cmd: >-
          C=$(crictl ps --name '^etcd$' --state running -q) &&
          crictl exec "$C" etcdctl --endpoints=https://127.0.0.1:2379 {{ etcdctl_env }}
          snapshot save /var/lib/etcd/snapshot-pre-timings.db &&
          cp /var/lib/etcd/snapshot-pre-timings.db {{ etcd_snapshot }} &&
          rm -f /var/lib/etcd/snapshot-pre-timings.db
        creates: "{{ etcd_snapshot }}"

    - name: Confirm the snapshot is a real one
      ansible.builtin.stat:
        path: "{{ etcd_snapshot }}"
      register: et_snap
      failed_when: not et_snap.stat.exists or et_snap.stat.size < 1000000

    - name: Change it
      block:

        # -- the half that matters most: what future members are generated from ----------------

        - name: Write etcd.local.extraArgs into kubeadm-config
          ansible.builtin.copy:
            dest: /etc/kubernetes/kubeadm-etcd-timings.yaml
            mode: "0600"
            content: |
              {{ et_cc | combine({
                   'etcd': (et_cc.etcd | default({})) | combine({
                     'local': ((et_cc.etcd | default({})).local | default({})) | combine({
                       'extraArgs':
                         (((et_cc.etcd | default({})).local | default({})).extraArgs | default([])
                          | rejectattr('name', 'in', etcd_timings.keys() | list) | list)
                         + (etcd_timings | dict2items(key_name='name', value_name='value'))
                     }, recursive=True)
                   }, recursive=True)
                 }, recursive=True) | to_nice_yaml(indent=2) }}

        - name: Upload it
          ansible.builtin.command: >-
            kubeadm init phase upload-config kubeadm
            --config /etc/kubernetes/kubeadm-etcd-timings.yaml
          changed_when: true

        # -- the half that restarts things: master-1's own manifest ----------------------------

        - name: Start a candidate manifest OUTSIDE the manifests directory
          # Editing in place would let kubelet pick up a half-written or unparseable file. Nothing
          # in /etc/kubernetes/manifests is ever edited by this playbook until it has been checked.
          ansible.builtin.copy:
            src: "{{ etcd_manifest }}"
            dest: "{{ etcd_candidate }}"
            remote_src: true
            mode: "0600"

        - name: Set each timing flag on the candidate
          # Replaces the flag if it is there, and inserts it inside the command list if it is not --
          # after --data-dir, which kubeadm always emits exactly once.
          ansible.builtin.lineinfile:
            path: "{{ etcd_candidate }}"
            regexp: '^\s*- --{{ item.key }}='
            line: '    - --{{ item.key }}={{ item.value }}'
            insertafter: '^\s*- --data-dir='
          loop: "{{ etcd_timings | dict2items }}"

        - name: The candidate must still be valid YAML
          ansible.builtin.command: python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" {{ etcd_candidate }}
          changed_when: false

        - name: The candidate must carry every wanted flag and have lost nothing
          # The second half is the one that matters: a bad regexp that replaced the wrong line would
          # produce a file that parses perfectly and starts an etcd missing a certificate flag.
          #
          # `command: argv:` with a literal `|` block, NOT `shell: cmd: >-`. A folded scalar joins
          # lines with spaces, so a heredoc written that way arrives as one line and bash dies on it
          # -- which is exactly how this task failed on 2026-10-15 at 17:44 UTC. It failed safely,
          # because the candidate lives outside the manifests directory and etcd was never
          # restarted, but the lesson is general: never put multi-line anything in a `>-` scalar.
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json, sys, yaml
                want = json.loads(sys.argv[1])
                old = yaml.safe_load(open(sys.argv[2]))["spec"]["containers"][0]["command"]
                new = yaml.safe_load(open(sys.argv[3]))["spec"]["containers"][0]["command"]
                def names(cmd):
                    return {a.split("=", 1)[0] for a in cmd if a.startswith("--")}
                missing = names(old) - names(new)
                if missing:
                    sys.exit("candidate LOST flags: %s" % sorted(missing))
                dupes = sorted(n for n in names(new)
                               if sum(1 for a in new if a.split("=", 1)[0] == n) > 1)
                if dupes:
                    sys.exit("candidate has DUPLICATE flags: %s" % dupes)
                have = dict(a[2:].split("=", 1) for a in new if a.startswith("--") and "=" in a)
                for k, v in want.items():
                    if have.get(k) != v:
                        sys.exit("candidate has %s=%r, wanted %r" % (k, have.get(k), v))
                print("candidate ok: %d flags, none lost, no duplicates, %d set"
                      % (len(names(new)), len(want)))
              - "{{ etcd_timings | to_json }}"
              - "{{ etcd_manifest }}"
              - "{{ etcd_candidate }}"
          register: et_candidate_check
          changed_when: false

        - name: Move the candidate into place -- etcd restarts here
          ansible.builtin.copy:
            src: "{{ etcd_candidate }}"
            dest: "{{ etcd_manifest }}"
            remote_src: true
            mode: "0600"

        - name: Wait for etcd to come back as a NEW container
          # Not "wait for etcd to be healthy": the old container is healthy too, and would satisfy
          # that for the ~10s before kubelet notices the manifest changed.
          ansible.builtin.shell:
            cmd: crictl ps --name '^etcd$' --state running -q
          register: et_cid_post
          changed_when: false
          until: et_cid_post.stdout | trim | length > 0 and et_cid_post.stdout | trim != et_cid_pre.stdout | trim
          retries: 40
          delay: 5

        - name: Wait for it to be healthy
          ansible.builtin.uri:
            url: "{{ etcd_health_url }}"
            return_content: true
          register: et_health_post
          until: "'\"health\":\"true\"' in (et_health_post.content | default('') | replace(' ', ''))"
          retries: 40
          delay: 5

        - name: Wait for the API server to serve again
          ansible.builtin.command: "{{ kubectl }} get --raw /readyz"
          register: et_readyz
          changed_when: false
          until: et_readyz.rc == 0 and 'ok' in et_readyz.stdout
          retries: 40
          delay: 5

      rescue:

        - name: ROLLBACK -- put the original manifest back
          ansible.builtin.copy:
            src: "{{ etcd_backup }}/etcd.yaml"
            dest: "{{ etcd_manifest }}"
            remote_src: true
            mode: "0600"
          ignore_errors: true

        # Three small tasks rather than one clever shell line. The clever version was
        # `patch -p "$(python3 -c ... file)"` inside a `>-` scalar, where the more-indented
        # continuation line is kept as a literal newline by YAML -- so python got no argument, the
        # substitution was empty, and the rollback itself failed (2026-10-15 17:45 UTC). A rollback
        # that only works when its quoting is lucky is not a rollback.
        - name: ROLLBACK -- read the backed-up ClusterConfiguration
          ansible.builtin.slurp:
            src: "{{ etcd_backup }}/ClusterConfiguration.yaml"
          register: et_rb_value
          ignore_errors: true

        - name: ROLLBACK -- build the patch
          ansible.builtin.copy:
            dest: /tmp/kubeadm-config-rollback.json
            mode: "0600"
            content: "{{ {'data': {'ClusterConfiguration': (et_rb_value.content | b64decode)}} | to_json }}"
          when: et_rb_value.content is defined
          ignore_errors: true

        - name: ROLLBACK -- restore kubeadm-config
          ansible.builtin.command: >-
            {{ kubectl }} -n kube-system patch cm kubeadm-config --type merge
            --patch-file /tmp/kubeadm-config-rollback.json
          when: et_rb_value.content is defined
          ignore_errors: true

        - name: ROLLBACK -- wait for etcd on the original manifest
          ansible.builtin.uri:
            url: "{{ etcd_health_url }}"
            return_content: true
          register: et_rb
          until: "'\"health\":\"true\"' in (et_rb.content | default('') | replace(' ', ''))"
          retries: 40
          delay: 5
          ignore_errors: true

        - name: Stop, having rolled back
          ansible.builtin.fail:
            msg: >-
              etcd_timings.yml failed and rolled back. The manifest and kubeadm-config were restored
              from {{ etcd_backup }}. The snapshot at {{ etcd_snapshot }} was NOT used and is still
              there -- if etcd is not healthy now, that snapshot is the restore point. Read the
              failed task above before re-running.

    # ------------------------------------------------------------------ grade the installed thing

    - name: Re-read kubeadm-config after the change
      ansible.builtin.command: >-
        {{ kubectl }} -n kube-system get cm kubeadm-config
        -o jsonpath={.data.ClusterConfiguration}
      register: et_cc_post
      changed_when: false
      check_mode: false

    - name: The running member and kubeadm-config both carry the timings, and AGREE
      # One task, in Python, because the three facts are one property: a master joined now must get
      # exactly what master-1 is running. Splitting it across Jinja filters is how you end up with a
      # check that passes on a mismatch.
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys, yaml
            want = json.loads(sys.argv[1])
            cmd = yaml.safe_load(open(sys.argv[2]))["spec"]["containers"][0]["command"]
            have = dict(a[2:].split("=", 1) for a in cmd if a.startswith("--") and "=" in a)
            cc = yaml.safe_load(sys.argv[3])
            extra = (cc.get("etcd") or {}).get("local", {}).get("extraArgs") or []
            cc_have = {e["name"]: str(e["value"]) for e in extra}
            bad = []
            for k, v in want.items():
                if have.get(k) != v:
                    bad.append("manifest %s=%r wanted %r" % (k, have.get(k), v))
                if cc_have.get(k) != v:
                    bad.append("kubeadm-config %s=%r wanted %r" % (k, cc_have.get(k), v))
                if have.get(k) != cc_have.get(k):
                    bad.append("DISAGREE %s: manifest %r vs kubeadm-config %r"
                               % (k, have.get(k), cc_have.get(k)))
            if bad:
                sys.exit("; ".join(bad))
            print("manifest and kubeadm-config agree on: "
                  + " ".join("%s=%s" % kv for kv in sorted(want.items())))
          - "{{ etcd_timings | to_json }}"
          - "{{ etcd_manifest }}"
          - "{{ et_cc_post.stdout }}"
      register: et_agree
      changed_when: false
      check_mode: false

    - name: etcd did not lose data across the restart
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          C=$(crictl ps --name '^etcd$' --state running -q) &&
          crictl exec "$C" etcdctl --endpoints=https://127.0.0.1:2379 {{ etcdctl_env }}
          endpoint status -w json 2>/dev/null
          | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Status"]["raftIndex"])'
        executable: /bin/bash
      register: et_raft_post
      changed_when: false
      check_mode: false
      failed_when: (et_raft_post.stdout | trim | int) < (et_raft_pre.stdout | trim | int)

    - name: Every node is Ready again
      ansible.builtin.shell:
        cmd: "{{ kubectl }} get nodes --no-headers | awk '$2 != \"Ready\" {print $1}'"
      register: et_nodes_post
      changed_when: false
      check_mode: false
      failed_when: et_nodes_post.stdout | trim | length > 0
      retries: 24
      delay: 10
      until: et_nodes_post.stdout | trim | length == 0

    - name: No pod anywhere outside Running or Completed
      ansible.builtin.shell:
        cmd: "{{ kubectl }} get pods -A --no-headers | grep -v -E 'Running|Completed' || true"
      register: et_pods
      changed_when: false
      check_mode: false
      failed_when: et_pods.stdout | trim | length > 0
      retries: 24
      delay: 10
      until: et_pods.stdout | trim | length == 0

    - name: AWX is still there
      ansible.builtin.shell:
        cmd: "{{ kubectl }} -n awx get pods --no-headers | awk '$3 != \"Running\" {print $1}'"
      register: et_awx
      changed_when: false
      check_mode: false
      failed_when: et_awx.stdout | trim | length > 0
      retries: 24
      delay: 10
      until: et_awx.stdout | trim | length == 0

    # ---------------------------------------------------------------- reported, never graded

    - name: REPORT -- what kubeadm would generate from the ConfigMap now
      # Not a gate. It is here so that the day master-1's hand-edited manifest and kubeadm's
      # generated one diverge in some OTHER field, somebody sees it in a run log rather than in an
      # incident. `--dry-run` writes to a temp directory and touches nothing.
      #
      # `cmd: |` (literal), not `>-` (folded): a folded scalar keeps a more-indented line's newline
      # and joins the rest with spaces, which mangles any real shell.
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          kubeadm init phase etcd local --dry-run \
            --config /etc/kubernetes/kubeadm-etcd-timings.yaml >/dev/null 2>&1
          F=$(find /tmp /etc/kubernetes/tmp -maxdepth 3 -name etcd.yaml -newermt '-5 minutes' 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "no dry-run manifest produced on this kubeadm -- cross-check NOT performed"
            exit 0
          fi
          echo "kubeadm would generate: $F"
          if diff <(grep -oE -- '--[a-z-]+' "$F" | sort -u) \
                  <(grep -oE -- '--[a-z-]+' {{ etcd_manifest }} | sort -u) >/dev/null; then
            echo "same flag NAMES as master-1's manifest"
          else
            echo "flags differ between kubeadm's output and master-1's manifest:"
            diff <(grep -oE -- '--[a-z-]+' "$F" | sort -u) \
                 <(grep -oE -- '--[a-z-]+' {{ etcd_manifest }} | sort -u) || true
          fi
        executable: /bin/bash
      register: et_dryrun
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ [ 'timings: ' ~ (etcd_timings | dict2items | map(attribute='key')
                 | zip(etcd_timings | dict2items | map(attribute='value'))
                 | map('join', '=') | join(' ')),
               'raft index ' ~ (et_raft_pre.stdout | trim) ~ ' -> ' ~ (et_raft_post.stdout | trim),
               'etcd container ' ~ (et_cid_pre.stdout | trim | truncate(13, true, ''))
                 ~ ' -> ' ~ (et_cid_post.stdout | default({'stdout': 'unchanged'}).stdout | trim | truncate(13, true, '')),
               et_agree.stdout | default(''),
               'backups in ' ~ etcd_backup ~ ', snapshot at ' ~ etcd_snapshot ]
             + (et_dryrun.stdout_lines | default([])) }}
