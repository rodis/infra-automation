[ssh_connection]
pipelining=True
# ServerAlive*: notice a dead connection in ~2 minutes instead of never. Without them a connection
# that dies silently (e.g. sshd restarted by an upgrade) leaves the task waiting forever — see
# ../ansible.cfg, which carries the same for AWX.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=8
force_valid_group_names = ignore
