---
# Install Grafana Alloy and ship host metrics to Grafana Cloud.
#
# Thin on purpose. The work lives in roles/alloy so that ONE definition serves every host in the
# estate, while the differences between hosts stay where they already are: in the Spacelift space.
#
# south is two OS families, and that is why it is two spaces rather than one:
#
#   PostgreSQL space        Debian    `postgresql` context      ANSIBLE_REMOTE_USER=debian
#   Kubernetes: Infra space Ubuntu    `kubernetes-infra` context ANSIBLE_REMOTE_USER=ubuntu
#
# So this playbook is run by a stack in EACH space. Each inherits its own remote user, its own
# inventory, and its own `--limit`, and neither needs to know the other exists. Putting an OS
# conditional in the playbook instead would move that difference out of the place that already
# models it correctly.
#
# `hosts: all` is deliberate: the space's context already narrows the inventory. Overriding
# alloy_hosts is for running it by hand against something specific.

# kube-state-metrics first, so that by the time the collector probes for it, it exists. The role
# no-ops on every host without /etc/kubernetes/admin.conf, which is how it finds the control plane
# without needing a kube_control_plane group that south does not have.
- name: Install kube-state-metrics on the control plane
  hosts: "{{ alloy_hosts | default('all') }}"
  become: true
  roles:
    - role: ../../roles/kube_state_metrics

- name: Ship host metrics to Grafana Cloud
  hosts: "{{ alloy_hosts | default('all') }}"
  become: true

  roles:
    # By relative path rather than by name: this repo has no root ansible.cfg for AWX or Spacelift
    # to load, and adding one would newly apply the ssh settings in playbooks/ansible.cfg — a
    # behaviour change with no business riding along with a refactor.
    - role: ../../roles/alloy
