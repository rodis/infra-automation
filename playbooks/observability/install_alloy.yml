---
# Install Grafana Alloy on a VM and ship host metrics to Grafana Cloud.
#
# WHY THIS IS ITS OWN PLAYBOOK, AND NOT PART OF playbooks/postgresql/
#
# Adding these tasks to the PostgreSQL playbook would mean every monitoring change re-runs
# geerlingguy.postgresql against a live database. That role can restart PostgreSQL, and PostgreSQL
# is what AWX stores everything in — so a change to a metrics scrape interval could bounce the
# control plane. Monitoring must not be able to restart the thing it monitors.
#
# WHY ALLOY RATHER THAN node_exporter + prometheus
#
# Alloy has `prometheus.exporter.unix` built in — the node_exporter collectors, in-process — and
# can remote_write directly. One binary, one config, one service, no local Prometheus to run out of
# disk. When PostgreSQL metrics are added later it is `prometheus.exporter.postgres` in the same
# file, not another package.
#
# WHAT THIS DELIBERATELY DOES NOT DO YET
#
#   - PostgreSQL metrics. Those need a dedicated read-only monitoring role in the database
#     (pg_monitor), not the application's own DB_USER. That is a database change and belongs in its
#     own reviewed step.
#   - Logs. 50GB of free Loki is available, but shipping logs from a management-plane host is a
#     separate decision about what ends up in a third party's storage.
#
# CREDENTIALS come from the Spacelift `Observability` context as environment variables, the same
# mechanism playbooks/postgresql already uses for DB_PASSWORD. Only the token is secret; the
# endpoint is public and the "user" is a numeric instance id used as a basic-auth username.
#
# SERIES BUDGET: Grafana Cloud free allows 10,000 active series and a default `unix` exporter emits
# roughly 500-1000 per host. The collector list below is trimmed deliberately — see the comment on
# `set_collectors`. Adding collectors is cheap to do and expensive to notice.

- name: Ship host metrics to Grafana Cloud
  hosts: "{{ alloy_hosts | default('postgresql') }}"
  become: true

  vars:
    alloy_remote_write_url: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_URL') }}"
    alloy_remote_write_user: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_USER') }}"
    alloy_remote_write_token: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_TOKEN') }}"
    alloy_scrape_interval: 60s

  tasks:

    # Fail loudly and early rather than installing a collector that silently ships nowhere. A
    # misnamed context variable is the likeliest failure here, and an Alloy that starts, runs, and
    # writes to an empty URL looks healthy from every angle except the one that matters.
    - name: Check the remote_write settings were supplied
      ansible.builtin.assert:
        that:
          - alloy_remote_write_url | length > 0
          - alloy_remote_write_user | length > 0
          - alloy_remote_write_token | length > 0
        fail_msg: >-
          GRAFANA_REMOTE_WRITE_URL, _USER and _TOKEN must all be set. They come from the Spacelift
          `Observability` context — check the variable NAMES if the context is attached but this
          still fails.
        success_msg: "remote_write settings present"
      run_once: true

    # Mimir rejects out-of-order samples, so a host whose clock has drifted does not degrade
    # gracefully — it gets 400s from every write. Cheaper to guarantee time sync than to debug it
    # later from the receiving end.
    - name: Ensure the clock is disciplined
      ansible.builtin.package:
        name: systemd-timesyncd
        state: present

    - name: Start and enable time synchronisation
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: started
        enabled: true

    - name: Install the prerequisites for Grafana's apt repository
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - gpg
        state: present
        update_cache: true
        cache_valid_time: 3600

    # /etc/apt/keyrings is not present on every Debian release that might be under us.
    - name: Ensure the keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Grafana's signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    # Written directly rather than with ansible.builtin.apt_repository, which is deprecated and
    # removed in ansible-core 2.25. Its replacement, deb822_repository, needs 2.15+ — and the
    # version of Ansible in the Spacelift runner is not something this playbook should have an
    # opinion about. A source file is a source file on every version.
    - name: Add the Grafana apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main\n"
        owner: root
        group: root
        mode: "0644"
      register: alloy_repo

    - name: Refresh the package lists if the repository changed
      ansible.builtin.apt:
        update_cache: true
      when: alloy_repo is changed

    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present

    - name: Write the Alloy configuration
      ansible.builtin.template:
        src: config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        # 0640 and root:root — the file contains the remote_write token. Alloy runs as its own user
        # and reads it before dropping privileges via systemd.
        mode: "0640"
      notify: Restart alloy

    - name: Start and enable Alloy
      ansible.builtin.systemd:
        name: alloy
        state: started
        enabled: true
        daemon_reload: true

    - name: Flush handlers so the verification below tests the new config
      ansible.builtin.meta: flush_handlers

    # A running service is not a shipping service. Alloy starts happily with a config that writes
    # to an endpoint refusing every sample, so check what it says about itself rather than whether
    # systemd is content.
    - name: Give Alloy a moment to attempt its first write
      ansible.builtin.wait_for:
        timeout: 20
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read Alloy's own view of its health
      ansible.builtin.command: systemctl is-active alloy
      changed_when: false
      register: alloy_active

    - name: Look for remote_write errors in the journal
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          journalctl -u alloy --since "-2 min" --no-pager 2>/dev/null
          | grep -iE 'error|refused|401|403|400|out of order' | tail -10 || true
        executable: /bin/bash
      changed_when: false
      register: alloy_errors

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: alloy {{ alloy_active.stdout }},
          {{ 'no write errors in the last 2 minutes' if alloy_errors.stdout | length == 0
             else 'ERRORS: ' ~ alloy_errors.stdout_lines | join(' | ') }}

    - name: Fail if Alloy is not running or is reporting write errors
      ansible.builtin.assert:
        that:
          - alloy_active.stdout == 'active'
          - alloy_errors.stdout | length == 0
        fail_msg: >-
          Alloy is not shipping cleanly on {{ inventory_hostname }}. A 401 or 403 means the token or
          instance id is wrong; a 400 mentioning out-of-order samples means the clock is off; a
          connection refusal means the endpoint URL is wrong. Details above.

  handlers:
    - name: Restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true
