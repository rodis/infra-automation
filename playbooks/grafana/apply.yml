---
# Apply Grafana dashboards and alert rules from this repository.
#
# Dashboards and alert rules are CODE here, not UI state. Three reasons, in increasing order of
# importance:
#
#   - they survive a stack, an account, or a person
#   - a change gets a plan and a confirm like everything else
#   - and the agent that reads metrics must not be able to edit the rules that define health. An
#     agent that can move a threshold can grade itself against its own definition. Its Grafana
#     token is Viewer; the Editor token used here belongs to Spacelift, not to `agent-ops`.
#
# Runs against the Grafana API only — no hosts, no SSH, no inventory. `connection: local`.
#
# The API is idempotent for both objects: dashboards are posted with overwrite, and rule groups are
# PUT as a whole group, so this converges rather than accumulating duplicates. Deleting a rule from
# the JSON therefore removes it from Grafana, which is the property that makes this the source of
# truth rather than an additive script.

- name: Apply Grafana dashboards and alert rules
  hosts: localhost
  connection: local
  gather_facts: false
  # The account-wide `ansible` context sets ANSIBLE_BECOME=True for playbooks that configure real
  # hosts. This one runs inside the Spacelift runner and only makes HTTP calls, and that container
  # has no sudo — so without this it fails with "sudo: not found" before reaching Grafana.
  become: false

  vars:
    grafana_url: "{{ lookup('env', 'GRAFANA_API_URL') | regex_replace('/$', '') }}"
    grafana_token: "{{ lookup('env', 'GRAFANA_API_TOKEN') }}"
    grafana_folder_title: "Infrastructure"
    grafana_folder_uid: "infra"
    grafana_rule_group: "management-plane"
    # Pinned so a misconfigured endpoint cannot quietly write into the wrong Grafana. See the
    # boundary rule in infra-objectives/CLAUDE.md — a company Grafana or a second personal stack
    # would answer just as happily.
    grafana_expected_org_id: 1
    # Alert rules are gated separately from dashboards so that a failure in one cannot mask the
    # other. The gate defaults ON; it was held OFF from 2026-08-23 while the rule-group PUT
    # returned a bare 400 "bad request data" naming no field.
    #
    # Resolved the same day, and the method is the reusable part: Grafana serves its own OpenAPI
    # spec at /public/api-merged.json, readable with the Viewer token. Five deploys of guessing
    # produced five identical 400s; one read of the spec gave the exact shape. When an API
    # validates strictly and reports vaguely, go and read what it accepts instead of bisecting it
    # one deploy at a time.
    grafana_apply_alerts: "{{ (lookup('env', 'GRAFANA_APPLY_ALERTS') | default('true', true)) | bool }}"

  tasks:

    - name: Check the API settings were supplied
      ansible.builtin.assert:
        that:
          - grafana_url | length > 0
          - grafana_token | length > 0
        fail_msg: >-
          GRAFANA_API_URL and GRAFANA_API_TOKEN must be set. They come from the Spacelift context
          holding the EDITOR service account token — note this is a different credential from the
          read-only one in agent-ops, and a different KIND from a Cloud Access Policy token, which
          cannot write dashboards at all.

    # Refuse before writing rather than discover afterwards. Same guard as the Spacelift space and
    # context checks: assert the identity, do not assume the endpoint is the one you meant.
    - name: Identify the Grafana we are about to write to
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/org"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_org
      changed_when: false
      # A READ, so it must run in check mode. Without this the planning phase dies right here:
      # check mode skips uri, grafana_org.json never exists, and the assert below fails on an
      # undefined variable rather than on anything about Grafana. That is exactly what
      # SPACELIFT_SKIP_PLANNING was hiding on every Ansible stack until 2026-08-23.
      check_mode: false

    - name: Refuse if this is not the expected organisation
      ansible.builtin.assert:
        that:
          - grafana_org.json.id == grafana_expected_org_id
        fail_msg: >-
          Refusing to write. Expected org id {{ grafana_expected_org_id }}, got
          {{ grafana_org.json.id }} ({{ grafana_org.json.name }}) at {{ grafana_url }}.
        success_msg: "writing to org {{ grafana_org.json.id }} ({{ grafana_org.json.name }})"

    # Look first, then create. Creating-and-tolerating-the-conflict looked simpler, but the
    # conflict code is a moving target: this Grafana answers 412 "the folder has been changed by
    # someone else" where the documented behaviour is 409. Accepting a list of codes means
    # guessing which one a future version returns, and a wrong guess fails a run for a folder that
    # already exists.
    - name: Look for the folder
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/folders/{{ grafana_folder_uid }}"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        status_code: [200, 404]
      register: grafana_folder_lookup
      changed_when: false
      check_mode: false   # a read; the `when` below consumes its status

    - name: Create the folder if it is missing
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/folders"
        method: POST
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body: { uid: "{{ grafana_folder_uid }}", title: "{{ grafana_folder_title }}" }
        status_code: [200]
      when: grafana_folder_lookup.status == 404

    - name: Find the dashboards in this repository
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/dashboards"
        patterns: "*.json"
      register: grafana_dashboard_files

    - name: Apply each dashboard
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/dashboards/db"
        method: POST
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body:
          dashboard: "{{ lookup('file', item.path) | from_json }}"
          folderUid: "{{ grafana_folder_uid }}"
          # The repository is the source of truth, so a UI edit is overwritten rather than
          # protected. That is the intent: anything worth keeping belongs in git.
          overwrite: true
          message: "applied from infra-automation"
        status_code: [200]
      loop: "{{ grafana_dashboard_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: grafana_dashboards_applied
      changed_when: true

    - name: Say plainly that alert rules are being skipped
      ansible.builtin.debug:
        msg: >-
          SKIPPING alert rules — grafana_apply_alerts is false. The dashboards above are applied and
          current; alerting is NOT. Nothing is watching this estate while nobody is looking.
      when: not (grafana_apply_alerts | bool)

    - name: Load the alert rule definitions
      ansible.builtin.set_fact:
        grafana_alerts: "{{ lookup('file', playbook_dir ~ '/alerts/management-plane.json') | from_json }}"

    # PUT of a whole rule group, not POST per rule: the group becomes exactly what the file says,
    # so removing a rule here removes it in Grafana. A per-rule POST would only ever add, and the
    # file would slowly stop describing reality.
      when: grafana_apply_alerts | bool
    - name: Apply the alert rule group
      # PUT of a whole rule group, not POST per rule: the group becomes exactly what the file says,
      # so removing a rule here removes it in Grafana. A per-rule POST would only ever add.
      #
      # No X-Disable-Provenance. Sending it demands alert.provisioning.provenance:write, which an
      # Editor service account does not hold — the first attempt got a 403 naming exactly that.
      # Omitting it is also the behaviour we want: Grafana marks these rules provisioned and makes
      # them read-only in the UI, which is correct when this repository is the source of truth.
      #
      # Body shape taken from Grafana's own OpenAPI spec (/public/api-merged.json, definition
      # `AlertRuleGroup`) rather than guessed. Five deploys of guessing produced five identical
      # bare 400s naming no field; one read of the spec gave all of it:
      #
      #   AlertRuleGroup = folderUid, title, interval (INTEGER SECONDS, not "1m"), rules
      #
      # and every rule additionally requires orgID, folderUID and ruleGroup. Those three are
      # properties of WHERE a rule is being put rather than of what it says, so they are injected
      # here instead of duplicated into every rule in alerts/. An earlier comment in this file
      # asserted the group was {folder, name, ...} and NOT {title, ...}; that was exactly
      # backwards, and was written down as fact after one failing variant.
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/folder/{{ grafana_folder_uid }}/rule-groups/{{ grafana_rule_group }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ grafana_token }}"
        body_format: json
        body:
          folderUid: "{{ grafana_folder_uid }}"
          title: "{{ grafana_rule_group }}"
          interval: "{{ grafana_alerts.interval | default(60) | int }}"
          rules: >-
            {{ grafana_alerts.rules | map('combine', {
                 'orgID': grafana_org.json.id,
                 'folderUID': grafana_folder_uid,
                 'ruleGroup': grafana_rule_group
               }) | list }}
        status_code: [200, 202]
      register: grafana_rules_applied
      changed_when: true
      when: grafana_apply_alerts | bool

    # Applying is not the same as evaluating. A rule that cannot run reports nothing, and nothing
    # is indistinguishable from healthy — the exact trap this alerting exists to close. So read the
    # rules back and require they are in a state that can actually fire.
    #
    # NOT run in check mode. An earlier version carried `check_mode: false` here, inherited from a
    # sweep that marked reads so they would survive planning. That is wrong for a VERIFICATION
    # read: check mode deliberately does not apply the rules, so a forced read-back looks for
    # something that was never created and fails after six retries — which is how a correct plan
    # came to report failure. Reads that feed a decision need check_mode: false; reads that verify
    # a write must not have it.
    - name: Read the rules back
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/prometheus/grafana/api/v1/rules"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_rules_state
      changed_when: false
      retries: 6
      delay: 10
      until: >-
        grafana_rules_state.json.data.groups
        | map(attribute='rules') | flatten
        | selectattr('name', 'in', grafana_alerts.rules | map(attribute='title') | list)
        | list | length == (grafana_alerts.rules | length)
      when:
        - grafana_apply_alerts | bool
        - not ansible_check_mode

    - name: Report what is now watching
      ansible.builtin.debug:
        msg: >-
          {{ grafana_dashboard_files.files | length }} dashboard(s) applied;
          {{ grafana_alerts.rules | length }} alert rule(s) in group '{{ grafana_rule_group }}',
          health:
          {{ grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
             | selectattr('name', 'in', grafana_alerts.rules | map(attribute='title') | list)
             | map(attribute='health') | list | join(', ') }}
      when:
        - grafana_apply_alerts | bool
        - not ansible_check_mode

    - name: Check every rule is healthy, not merely present
      ansible.builtin.assert:
        that:
          - >-
            grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
            | selectattr('name', 'in', grafana_alerts.rules | map(attribute='title') | list)
            | rejectattr('health', 'equalto', 'ok') | list | length == 0
        fail_msg: >-
          One or more rules are present but not healthy — an erroring rule fires nothing and looks
          exactly like a quiet estate. Check the datasource uid and the expressions.
        success_msg: "all rules present and evaluating"
      when:
        - grafana_apply_alerts | bool
        - not ansible_check_mode
