---
# Apply Grafana dashboards and alert rules from this repository.
#
# Dashboards and alert rules are CODE here, not UI state. Three reasons, in increasing order of
# importance:
#
#   - they survive a stack, an account, or a person
#   - a change gets a plan and a confirm like everything else
#   - and the agent that reads metrics must not be able to edit the rules that define health. An
#     agent that can move a threshold can grade itself against its own definition. Its Grafana
#     token is Viewer; the Editor token used here belongs to Spacelift, not to `agent-ops`.
#
# Runs against the Grafana API only — no hosts, no SSH, no inventory. `connection: local`.
#
# The API is idempotent for both objects: dashboards are posted with overwrite, and rule groups are
# PUT as a whole group, so this converges rather than accumulating duplicates. Deleting a rule from
# the JSON therefore removes it from Grafana, which is the property that makes this the source of
# truth rather than an additive script.

- name: Apply Grafana dashboards and alert rules
  hosts: localhost
  connection: local
  gather_facts: false
  # The account-wide `ansible` context sets ANSIBLE_BECOME=True for playbooks that configure real
  # hosts. This one runs inside the Spacelift runner and only makes HTTP calls, and that container
  # has no sudo — so without this it fails with "sudo: not found" before reaching Grafana.
  become: false

  vars:
    grafana_url: "{{ lookup('env', 'GRAFANA_API_URL') | regex_replace('/$', '') }}"
    grafana_token: "{{ lookup('env', 'GRAFANA_API_TOKEN') }}"
    grafana_folder_title: "Infrastructure"
    grafana_folder_uid: "infra"
    # Group names come from the filenames in alerts/ (see below). They were once a single hardcoded
    # variable here, and the lesson from that is worth keeping: the group NAME was never the problem,
    # though a while was spent believing it was. The bare 400 came from `interval` being templated --
    # Ansible sent it as a STRING on the Spacelift runner where the identical expression produced an
    # int locally, and Grafana rejects a string there without saying so.
    # Pinned so a misconfigured endpoint cannot quietly write into the wrong Grafana. See the
    # boundary rule in infra-objectives/CLAUDE.md — a company Grafana or a second personal stack
    # would answer just as happily.
    grafana_expected_org_id: 1
    # Alert rules are gated separately from dashboards so that a failure in one cannot mask the
    # other. The gate defaults ON; it was held OFF from 2026-08-23 while the rule-group PUT
    # returned a bare 400 "bad request data" naming no field.
    #
    # Resolved the same day, and the method is the reusable part: Grafana serves its own OpenAPI
    # spec at /public/api-merged.json, readable with the Viewer token. Five deploys of guessing
    # produced five identical 400s; one read of the spec gave the exact shape. When an API
    # validates strictly and reports vaguely, go and read what it accepts instead of bisecting it
    # one deploy at a time.
    grafana_apply_alerts: "{{ (lookup('env', 'GRAFANA_APPLY_ALERTS') | default('true', true)) | bool }}"

    # Notifications are gated separately again, and for the same reason the alert gate exists: a
    # failure in one must not mask the other.
    #
    # This block was added on 2026-10-17 after finding the estate had been silent for nine days.
    # Four rules were applied, healthy and evaluating; eleven alert instances were active
    # continuously from 2026-10-08T19:16:40Z; and the root notification policy routed to a receiver
    # named `empty`. Nothing was ever delivered. The playbook had verified that rules EVALUATE and
    # never that a notification ARRIVES, which is this repository's own recurring failure --
    # grading the installer instead of the installed thing -- applied to its own alerting.
    #
    # So the contact point and the policy are code here, exactly like the rules, and the run proves
    # delivery before it reports success.
    grafana_apply_notifications: "{{ (lookup('env', 'GRAFANA_APPLY_NOTIFICATIONS') | default('true', true)) | bool }}"
    grafana_contact_point: "telegram-infra"
    # Chat and topic ids are NOT secrets (infra-objectives/dagu/README.md), so they are pinned here
    # where they can be read and reviewed, for the same reason org id 1 is pinned above: a
    # misconfigured id would deliver somewhere else just as happily as it delivers here.
    # Group "Pinky and the Brain", forum topic "Infra" -- where Dagu already posts, so every
    # unattended finding lands in one place.
    telegram_chat_id: "-1003933432943"
    telegram_topic_id: "2"
    # The `Pinky Bot` token, from the Spacelift context -- never from agent-ops at run time. The
    # agent may read alert STATE; it must not hold the path that defines where alerts go.
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"

  tasks:

    - name: Check the API settings were supplied
      ansible.builtin.assert:
        that:
          - grafana_url | length > 0
          - grafana_token | length > 0
        fail_msg: >-
          GRAFANA_API_URL and GRAFANA_API_TOKEN must be set. They come from the Spacelift context
          holding the EDITOR service account token — note this is a different credential from the
          read-only one in agent-ops, and a different KIND from a Cloud Access Policy token, which
          cannot write dashboards at all.

    # Refuse before writing rather than discover afterwards. Same guard as the Spacelift space and
    # context checks: assert the identity, do not assume the endpoint is the one you meant.
    - name: Identify the Grafana we are about to write to
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/org"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_org
      changed_when: false
      # A READ, so it must run in check mode. Without this the planning phase dies right here:
      # check mode skips uri, grafana_org.json never exists, and the assert below fails on an
      # undefined variable rather than on anything about Grafana. That is exactly what
      # SPACELIFT_SKIP_PLANNING was hiding on every Ansible stack until 2026-08-23.
      check_mode: false

    - name: Refuse if this is not the expected organisation
      ansible.builtin.assert:
        that:
          - grafana_org.json.id == grafana_expected_org_id
        fail_msg: >-
          Refusing to write. Expected org id {{ grafana_expected_org_id }}, got
          {{ grafana_org.json.id }} ({{ grafana_org.json.name }}) at {{ grafana_url }}.
        success_msg: "writing to org {{ grafana_org.json.id }} ({{ grafana_org.json.name }})"

    # Look first, then create. Creating-and-tolerating-the-conflict looked simpler, but the
    # conflict code is a moving target: this Grafana answers 412 "the folder has been changed by
    # someone else" where the documented behaviour is 409. Accepting a list of codes means
    # guessing which one a future version returns, and a wrong guess fails a run for a folder that
    # already exists.
    - name: Look for the folder
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/folders/{{ grafana_folder_uid }}"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        status_code: [200, 404]
      register: grafana_folder_lookup
      changed_when: false
      check_mode: false   # a read; the `when` below consumes its status

    - name: Create the folder if it is missing
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/folders"
        method: POST
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body: { uid: "{{ grafana_folder_uid }}", title: "{{ grafana_folder_title }}" }
        status_code: [200]
      when: grafana_folder_lookup.status == 404

    - name: Check the Telegram settings were supplied
      ansible.builtin.assert:
        that:
          - telegram_bot_token | length > 0
        fail_msg: >-
          TELEGRAM_BOT_TOKEN must be set. It is the `token` field of the `Pinky Bot` item, added to
          the Spacelift context `grafana-provisioning` as a WRITE-ONLY variable. Without it the
          contact point cannot be written, and rules would go back to notifying nobody.
      when: grafana_apply_notifications | bool

    # Look first, then create -- the same shape as the folder above, and for the same reason: the
    # provisioning API has one endpoint for create (POST, no uid in the path) and another for
    # update (PUT /{uid}), and POSTing an existing uid is an error rather than an upsert.
    - name: Look for the contact point
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/contact-points"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_contact_points
      changed_when: false
      check_mode: false   # a read whose result chooses POST or PUT below
      when: grafana_apply_notifications | bool

    # `bottoken` is a SECURE setting: Grafana stores it encrypted and returns it redacted, so a
    # read-compare-write would see a difference on every run and could never converge. The write is
    # therefore unconditional, exactly like the rule-group PUT -- the file is the source of truth
    # and the API call is idempotent by replacement rather than by comparison.
    #
    # no_log is NOT optional here. The body carries the bot token, and ansible.builtin.uri prints
    # its body on failure. `postgres_users_no_log: false` put the AWX database password into a
    # Spacelift run log on 2026-08-23, where it persists in run history; this is the same hazard in
    # the same place.
    - name: Create or update the Telegram contact point
      ansible.builtin.uri:
        # `| bool` on both, and it is load-bearing. Ansible templates contact_point_exists to the
        # STRING "False", and a non-empty string is truthy in Jinja -- without the filter this
        # always chooses PUT and 404s the first time the contact point does not exist yet. Same
        # class of bug as `interval` being sent as a string to the rule-group endpoint, noted
        # above: the value looks right and the type is wrong.
        url: >-
          {{ grafana_url }}/api/v1/provisioning/contact-points{{
            ('/' ~ grafana_contact_point) if (contact_point_exists | bool) else '' }}
        method: "{{ 'PUT' if (contact_point_exists | bool) else 'POST' }}"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body:
          uid: "{{ grafana_contact_point }}"
          name: "{{ grafana_contact_point }}"
          type: telegram
          disableResolveMessage: false
          # Keys taken from GET /api/alert-notifiers on this Grafana, not from memory: `bottoken`
          # and `chatid` are required, `message_thread_id` is how a forum topic is addressed.
          settings:
            bottoken: "{{ telegram_bot_token }}"
            chatid: "{{ telegram_chat_id }}"
            message_thread_id: "{{ telegram_topic_id }}"
            parse_mode: HTML
        # Every plausible status is accepted here and judged in the next task. This body carries a
        # secret, so the task must be no_log -- and a no_log failure prints NOTHING, which in this
        # playbook's own history is how five deploys produced five identical bare 400s naming no
        # field. Splitting the call from the verdict buys a task that can speak.
        status_code: [200, 202, 400, 401, 403, 404, 409]
      vars:
        contact_point_exists: >-
          {{ (grafana_contact_points.json | default([]))
             | selectattr('uid', 'defined')
             | selectattr('uid', 'equalto', grafana_contact_point)
             | list | length > 0 }}
      register: grafana_contact_point_write
      no_log: true
      changed_when: true
      when: grafana_apply_notifications | bool

    - name: Check the contact point was written
      ansible.builtin.assert:
        that:
          - grafana_contact_point_write.status in [200, 202]
        fail_msg: >-
          Writing the contact point failed with HTTP {{ grafana_contact_point_write.status }}:
          {{ (grafana_contact_point_write.json.message | default('no message'))
             | regex_replace('[0-9]{6,}:[A-Za-z0-9_-]{30,}', '<redacted>') }}.
          A 401 or 403 means the Editor service account token is wrong or lacks
          alert.provisioning:write; a 400 means the settings shape is wrong -- read
          /api/alert-notifiers for the telegram option names rather than guessing at them.
        success_msg: "contact point '{{ grafana_contact_point }}' written"
      # Grafana does not echo SECURE settings back in an error, so the message is safe to print;
      # the regex is belt and braces against a future version that does.
      #
      # `not ansible_check_mode` because the write above is skipped in check mode, leaving the
      # registered result with no `.status` -- asserting on it would fail the PLAN rather than the
      # run. Exactly the trap the rule read-back below documents, in the other direction.
      when:
        - grafana_apply_notifications | bool
        - not ansible_check_mode

    # The root route is the whole bug. Rules carry `severity` and `estate` labels already, so
    # splitting critical from warning later is a change to this tree and not to any rule.
    - name: Point the notification policy at the contact point
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/policies"
        method: PUT
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body:
          receiver: "{{ grafana_contact_point }}"
          group_by: ["grafana_folder", "alertname"]
          group_wait: 30s
          group_interval: 5m
          # 24h, against Grafana's default of 4h, to match notify-gate.sh's `remind_after=86400`.
          # Both post into the same Telegram topic, so they have to agree on cadence or the
          # quieter one is drowned by the louder. The reasoning is notify-gate's own: an alert
          # channel that repeats itself teaches you to stop reading it. The FIRST notification is
          # what matters; a repeat is only a reminder the finding is still there.
          repeat_interval: 24h
        status_code: [200, 202]
      changed_when: true
      when: grafana_apply_notifications | bool

    - name: Find the dashboards in this repository
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/dashboards"
        patterns: "*.json"
      register: grafana_dashboard_files

    - name: Apply each dashboard
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/dashboards/db"
        method: POST
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        body_format: json
        body:
          dashboard: "{{ lookup('file', item.path) | from_json }}"
          folderUid: "{{ grafana_folder_uid }}"
          # The repository is the source of truth, so a UI edit is overwritten rather than
          # protected. That is the intent: anything worth keeping belongs in git.
          overwrite: true
          message: "applied from infra-automation"
        status_code: [200]
      loop: "{{ grafana_dashboard_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: grafana_dashboards_applied
      changed_when: true

    - name: Say plainly that alert rules are being skipped
      ansible.builtin.debug:
        msg: >-
          SKIPPING alert rules — grafana_apply_alerts is false. The dashboards above are applied and
          current; alerting is NOT. Nothing is watching this estate while nobody is looking.
      when: not (grafana_apply_alerts | bool)

    # One file per rule GROUP, globbed like the dashboards above rather than named in a variable.
    # The group's name is the file's name. Added 2026-10-17 when a second group arrived
    # (monitoring-stack, which watches the monitoring box); until then a single hardcoded
    # `grafana_rule_group` was enough, and it quietly meant that adding a group meant editing the
    # playbook rather than adding a file.
    - name: Find the alert rule groups in this repository
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/alerts"
        patterns: "*.json"
      register: grafana_alert_files
      when: grafana_apply_alerts | bool

    - name: Load each rule group
      ansible.builtin.set_fact:
        grafana_rule_groups: >-
          {{ (grafana_rule_groups | default([])) + [{
               'name': (item.path | basename | regex_replace('\.json$', '')),
               'rules': ((lookup('file', item.path) | from_json).rules | default([]))
             }] }}
      loop: "{{ grafana_alert_files.files | sort(attribute='path') }}"
      loop_control: {label: "{{ item.path | basename }}" }
      when: grafana_apply_alerts | bool

    # The file is the source of truth, and that has to hold when a file says "nothing". PUT with an
    # empty `rules` array has unspecified behaviour -- the spec marks every AlertRuleGroup field
    # optional and says nothing about emptiness -- so the empty case gets its own verb instead of a
    # guess. 404 is accepted: a group already gone is the state we wanted.
    - name: Retire any rule group whose file holds no rules
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/folder/{{ grafana_folder_uid }}/rule-groups/{{ item.name }}"
        method: DELETE
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        status_code: [200, 202, 204, 404]
      loop: "{{ grafana_rule_groups | default([]) | rejectattr('rules') | list }}"
      loop_control: {label: "{{ item.name }}" }
      changed_when: true
      when: grafana_apply_alerts | bool

    - name: Apply each rule group that has rules
      # PUT of a whole rule group, not POST per rule: the group becomes exactly what the file says,
      # so removing a rule there removes it in Grafana. A per-rule POST would only ever add, and the
      # file would slowly stop describing reality.
      #
      # No X-Disable-Provenance. Sending it demands alert.provisioning.provenance:write, which an
      # Editor service account does not hold -- the first attempt got a 403 naming exactly that.
      # Omitting it is also the behaviour we want: Grafana marks these rules provisioned and makes
      # them read-only in the UI, which is correct when this repository is the source of truth.
      #
      # Body shape taken from Grafana's own OpenAPI spec (/public/api-merged.json, definition
      # `AlertRuleGroup`) rather than guessed. Five deploys of guessing produced five identical bare
      # 400s naming no field; one read of the spec gave all of it:
      #
      #   AlertRuleGroup = folderUid, title, interval (INTEGER SECONDS, not "1m"), rules
      #
      # and every rule additionally requires orgID, folderUID and ruleGroup. Those three are
      # properties of WHERE a rule is being put rather than of what it says, so they are injected
      # here instead of duplicated into every rule in alerts/.
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/folder/{{ grafana_folder_uid }}/rule-groups/{{ item.name }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ grafana_token }}"
        body_format: json
        body:
          folderUid: "{{ grafana_folder_uid }}"
          title: "{{ item.name }}"
          # A LITERAL, not a template. Grafana requires an integer here, and a templated value is
          # the one remaining difference between this request and the bisect that returned 200 for
          # this exact rule set. Ansible preserves int types through a whole-string template in a
          # local test, but that was never verified on the Spacelift runner, and "verified
          # somewhere else" is how most of that day's wrong turns started.
          interval: 60
          rules: >-
            {{ item.rules | map('combine', {
                 'orgID': grafana_org.json.id,
                 'folderUID': grafana_folder_uid,
                 'ruleGroup': item.name
               }) | list }}
        status_code: [200, 202]
      loop: "{{ grafana_rule_groups | default([]) | selectattr('rules') | list }}"
      loop_control: {label: "{{ item.name }} ({{ item.rules | length }} rules)" }
      changed_when: true
      when: grafana_apply_alerts | bool

    - name: Every rule title this repository defines, across all groups
      ansible.builtin.set_fact:
        grafana_expected_rules: >-
          {{ grafana_rule_groups | default([]) | map(attribute='rules') | flatten
             | map(attribute='title') | list }}
      when: grafana_apply_alerts | bool

    # Applying is not the same as evaluating. A rule that cannot run reports nothing, and nothing is
    # indistinguishable from healthy -- the exact trap this alerting exists to close. So read the
    # rules back and require they are in a state that can actually fire.
    - name: Read the rules back
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/prometheus/grafana/api/v1/rules"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_rules_state
      changed_when: false
      # Wait for PRESENT and EVALUATING, not just present. A rule reports health "unknown" until its
      # first evaluation, and with a 60s group interval that is a couple of minutes after creation.
      # Waiting only for presence meant the assert below fired against freshly created rules and
      # failed a run that had actually succeeded.
      #
      # 12 x 15s covers the interval plus scheduler start-up with room to spare.
      retries: 12
      delay: 15
      until: >-
        (grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
         | selectattr('name', 'in', grafana_expected_rules)
         | list | length == (grafana_expected_rules | length))
        and
        (grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
         | selectattr('name', 'in', grafana_expected_rules)
         | rejectattr('health', 'equalto', 'ok') | list | length == 0)
      when:
        - grafana_apply_alerts | bool
        - grafana_expected_rules | length > 0
        - not ansible_check_mode

    - name: Report what is now watching
      ansible.builtin.debug:
        msg: >-
          {{ grafana_dashboard_files.files | length }} dashboard(s) applied;
          {{ grafana_rule_groups | default([]) | selectattr('rules') | list | length }} rule group(s)
          [{{ grafana_rule_groups | default([]) | selectattr('rules') | map(attribute='name') | join(', ') }}],
          {{ grafana_expected_rules | length }} rule(s), health:
          {{ grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
             | selectattr('name', 'in', grafana_expected_rules)
             | map(attribute='health') | list | join(', ') }}
      when:
        - grafana_apply_alerts | bool
        - grafana_expected_rules | length > 0
        - not ansible_check_mode

    - name: Check every rule is healthy, not merely present
      ansible.builtin.assert:
        that:
          - >-
            grafana_rules_state.json.data.groups | map(attribute='rules') | flatten
            | selectattr('name', 'in', grafana_expected_rules)
            | rejectattr('health', 'equalto', 'ok') | list | length == 0
        fail_msg: >-
          One or more rules are present but not healthy — an erroring rule fires nothing and looks
          exactly like a quiet estate. Check the datasource uid and the expressions.
        success_msg: "all rules present and evaluating"
      when:
        - grafana_apply_alerts | bool
        - grafana_expected_rules | length > 0
        - not ansible_check_mode

    - name: Read the notification policy back
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/v1/provisioning/policies"
        headers: { Authorization: "Bearer {{ grafana_token }}" }
        return_content: true
      register: grafana_policy_state
      changed_when: false
      # NOT check_mode: false. This verifies a write, and check mode deliberately does not perform
      # the write -- forcing the read would look for something never created. Same distinction the
      # rule read-back above documents.
      when:
        - grafana_apply_notifications | bool
        - not ansible_check_mode

    - name: Check that alerts now route somewhere real
      ansible.builtin.assert:
        that:
          - grafana_policy_state.json.receiver == grafana_contact_point
        fail_msg: >-
          The root notification policy routes to '{{ grafana_policy_state.json.receiver }}',
          not '{{ grafana_contact_point }}'. Alert rules will evaluate perfectly and tell nobody.
          This is the exact state the estate was in from 2026-10-08 to 2026-10-17, when the root
          route pointed at a receiver named 'empty'.
        success_msg: "alerts route to '{{ grafana_contact_point }}'"
      when:
        - grafana_apply_notifications | bool
        - not ansible_check_mode

    # The token is in the URL -- Telegram has no header auth -- so this must be no_log, which also
    # hides WHY it failed. Every plausible status is therefore accepted here and judged in the
    # next task, which can speak freely: Telegram's error text names the problem
    # ("chat not found", "message thread not found", "Unauthorized") and never echoes the token.
    - name: Prove a message can actually be delivered to Telegram
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_chat_id }}"
          message_thread_id: "{{ telegram_topic_id | int }}"
          text: >-
            Grafana alerting provisioned from infra-automation. This is the delivery test; if you
            can read it, the path that was silent from 2026-10-08 to 2026-10-17 is open again.
        status_code: [200, 400, 401, 403, 404]
      register: telegram_probe
      no_log: true
      changed_when: false
      when:
        - grafana_apply_notifications | bool
        - not ansible_check_mode

    - name: Check Telegram accepted the message
      ansible.builtin.assert:
        that:
          - telegram_probe.status == 200
        fail_msg: >-
          Telegram refused the delivery test with HTTP {{ telegram_probe.status }}:
          {{ telegram_probe.json.description | default('no description') }}.
          A 401 means the bot token is wrong; "chat not found" means telegram_chat_id is wrong;
          "message thread not found" means telegram_topic_id is wrong or the topic was deleted.
          The contact point is written either way, so fix the value and re-run -- do not assume
          alerting works because this playbook otherwise succeeded.
        success_msg: >-
          Telegram accepted the test message into chat {{ telegram_chat_id }} topic
          {{ telegram_topic_id }} — alerting is delivering, not merely evaluating.
      when:
        - grafana_apply_notifications | bool
        - not ansible_check_mode
