---
# Reboot machines that a package upgrade has left needing one, and wait for them to come back.
#
# `apt upgrade dist` frequently installs a new kernel or libc. Debian records that in
# /var/run/reboot-required, and until the reboot happens the machine is running code it is no
# longer configured with. Doing this deliberately, before kubespray, is much better than
# discovering it mid-install or leaving nodes to be rebooted at some unrelated later moment.
#
# Idempotent: on a machine that does not need a reboot this changes nothing.

- name: Reboot machines that require it
  hosts: all
  become: true

  tasks:
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report why
      ansible.builtin.command: cat /var/run/reboot-required.pkgs
      register: reboot_pkgs
      changed_when: false
      failed_when: false
      when: reboot_required.stat.exists

    - name: Show the packages that asked for it
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs a reboot for: {{ reboot_pkgs.stdout_lines | default(['(unrecorded)']) }}"
      when: reboot_required.stat.exists

    - name: Reboot and wait for the machine to return
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 15
        msg: "Rebooting after package upgrade, before kubespray"
      when: reboot_required.stat.exists
