---
# Publish a freshly built cluster's kubeconfig into its AWX credential (type 31, "Kubernetes").
#
#   AWX template "General: Kubernetes: Cluster: Publish kubeconfig to AWX", launched with the
#   cluster's inventory, a machine credential, the "AWX: kubeconfig publisher" credential (type 16),
#   and extra var kubeconfig_credential_id (development 7, production 11).
#
# WHY: every rebuild re-issues the cluster's CA and certificates, so the AWX credential that app
# installs use goes stale on each one — credential 7 still held a February cluster on 2026-10-02.
# cluster-build runs this after the post-install tests pass.
#
# THE KUBECONFIG NEVER LEAVES THE JOB. It goes from the master to AWX's API inside this playbook:
# every task that holds it is no_log, and the scratch files are removed in an always: block. The
# agent that launches this sees only pass/fail.
#
# WHAT IT DOES
#   1. reads /etc/kubernetes/admin.conf from the first control-plane node
#   2. rewrites `server:` from https://127.0.0.1:6443 (kubeadm's local address, useless to AWX) to
#      that node's public address — covered by the API server certificate's SANs
#   3. PROVES it works from here, where AWX jobs will use it: lists the nodes with it. A kubeconfig
#      that fails this is never written, so a broken one cannot replace a working one
#   4. refuses unless the target credential is of type 31, then writes it
#
# Endpoint: the first master only — there is no load balancer in front of the API. If that master
# is down the credential stops working until the next publish.

- name: Read the cluster's admin kubeconfig
  hosts: "{{ groups['kube_control_plane'][0] }}"
  become: true
  gather_facts: false
  tasks:
    - name: Read /etc/kubernetes/admin.conf
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf
      no_log: true

- name: Check it and publish it to AWX
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    source_host: "{{ groups['kube_control_plane'][0] }}"
    api_server: "https://{{ hostvars[source_host].ansible_host }}:6443"
    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}"
    controller_token: "{{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
  tasks:
    - name: Require the target credential id and the publisher credential
      ansible.builtin.assert:
        that:
          - kubeconfig_credential_id is defined
          - (kubeconfig_credential_id | string) is match('^[0-9]+$')
          - controller_host | length > 0
          - controller_token | length > 0
        fail_msg: >-
          Launch with extra var kubeconfig_credential_id and the "AWX: kubeconfig publisher"
          credential (type 16), which provides CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN.

    - name: Rewrite the API server address for use from outside the cluster
      ansible.builtin.set_fact:
        kubeconfig_out: >-
          {{ hostvars[source_host].admin_conf.content | b64decode
             | regex_replace('server: https://127\.0\.0\.1:6443', 'server: ' ~ api_server) }}
      no_log: true

    - name: Refuse a kubeconfig that still points at localhost
      ansible.builtin.assert:
        that: "'server: ' ~ api_server in kubeconfig_out"
        fail_msg: "server: was not rewritten to {{ api_server }} — the source kubeconfig has an unexpected shape"
      no_log: true

    - name: Prove the kubeconfig works from here before writing it
      block:
        - name: Make a scratch directory for the client certificate
          ansible.builtin.tempfile:
            state: directory
            suffix: kubeconfig
          register: scratch

        - name: Write the CA, client certificate and key to scratch files
          ansible.builtin.copy:
            dest: "{{ scratch.path }}/{{ item.file }}"
            content: "{{ ((kubeconfig_out | from_yaml)[item.section][0][item.inner][item.key]) | b64decode }}"
            mode: "0600"
          loop:
            - {file: ca.crt, section: clusters, inner: cluster, key: certificate-authority-data}
            - {file: client.crt, section: users, inner: user, key: client-certificate-data}
            - {file: client.key, section: users, inner: user, key: client-key-data}
          no_log: true

        - name: List the nodes with it
          ansible.builtin.uri:
            url: "{{ api_server }}/api/v1/nodes"
            ca_path: "{{ scratch.path }}/ca.crt"
            client_cert: "{{ scratch.path }}/client.crt"
            client_key: "{{ scratch.path }}/client.key"
            return_content: true
          register: nodes

        - name: Report what it can see
          ansible.builtin.debug:
            msg: "{{ api_server }} answers this kubeconfig: {{ nodes.json['items'] | map(attribute='metadata.name') | list }}"
      always:
        - name: Remove the scratch files
          ansible.builtin.file:
            path: "{{ scratch.path }}"
            state: absent
          when: scratch.path is defined

    - name: Read the target credential (metadata only)
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/credentials/{{ kubeconfig_credential_id }}/"
        headers: {Authorization: "Bearer {{ controller_token }}"}
      register: target
      no_log: true

    - name: Refuse anything but a Kubernetes (type 31) credential
      ansible.builtin.assert:
        that: target.json.credential_type == 31
        fail_msg: "credential {{ kubeconfig_credential_id }} ({{ target.json.name }}) is type {{ target.json.credential_type }}, not 31 — not writing a kubeconfig into it"

    - name: Write the kubeconfig into the credential
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/v2/credentials/{{ kubeconfig_credential_id }}/"
        method: PATCH
        headers: {Authorization: "Bearer {{ controller_token }}"}
        body_format: json
        body: {inputs: {kubeconfig: "{{ kubeconfig_out }}"}}
      no_log: true

    - name: Published
      ansible.builtin.debug:
        msg: "credential {{ kubeconfig_credential_id }} ({{ target.json.name }}) now holds {{ source_host }}'s kubeconfig for {{ api_server }}"
