---
# Read-back check: does the kubeconfig STORED in an AWX Kubernetes credential (type 31) work?
#
#   AWX template "General: Kubernetes: Cluster: Check kubeconfig credential", launched with any
#   inventory (it runs on localhost) and the Kubernetes credential to test (development 7,
#   production 11). The credential injects the kubeconfig as the file named by $KUBECONFIG.
#
# Separate from publish_kubeconfig.yml on purpose: that one proves the kubeconfig worked before it
# was written; this proves what AWX actually stored and hands to jobs — which is what app installs
# will get. Read-only: lists nodes, changes nothing. No extra libraries: plain uri with the client
# certificate, so it runs in any execution environment.

- name: Check the kubeconfig in this job's Kubernetes credential
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_file: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
  tasks:
    - name: Require a Kubernetes credential on the job
      ansible.builtin.assert:
        that: kubeconfig_file | length > 0
        fail_msg: "No KUBECONFIG — launch with a Kubernetes (type 31) credential"

    - name: Load it
      ansible.builtin.set_fact:
        kc: "{{ lookup('ansible.builtin.file', kubeconfig_file) | from_yaml }}"
      no_log: true

    - name: List the nodes with it
      block:
        - name: Make a scratch directory
          ansible.builtin.tempfile:
            state: directory
            suffix: kubeconfig
          register: scratch

        - name: Write the CA, client certificate and key
          ansible.builtin.copy:
            dest: "{{ scratch.path }}/{{ item.file }}"
            content: "{{ (kc[item.section][0][item.inner][item.key]) | b64decode }}"
            mode: "0600"
          loop:
            - {file: ca.crt, section: clusters, inner: cluster, key: certificate-authority-data}
            - {file: client.crt, section: users, inner: user, key: client-certificate-data}
            - {file: client.key, section: users, inner: user, key: client-key-data}
          no_log: true

        - name: GET /api/v1/nodes
          ansible.builtin.uri:
            url: "{{ kc.clusters[0].cluster.server }}/api/v1/nodes"
            ca_path: "{{ scratch.path }}/ca.crt"
            client_cert: "{{ scratch.path }}/client.crt"
            client_key: "{{ scratch.path }}/client.key"
          register: nodes

        - name: Report
          ansible.builtin.debug:
            msg: >-
              {{ kc.clusters[0].cluster.server }}: {{ nodes.json['items'] | length }} nodes —
              {{ nodes.json['items'] | map(attribute='metadata.name') | list }}
      always:
        - name: Remove the scratch files
          ansible.builtin.file:
            path: "{{ scratch.path }}"
            state: absent
          when: scratch.path is defined
