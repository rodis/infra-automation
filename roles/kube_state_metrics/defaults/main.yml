---
# kube-state-metrics: object state for the cluster AWX runs on.
#
# This is the level-2 gap the Kubernetes dashboard has been describing since it was written. etcd
# is the only component that exposes metrics without credentials, so pod phases, deployment
# replicas, node conditions and restart counts were all invisible -- a cluster could have
# crash-looping pods and NotReady nodes with every existing panel green.
#
# It runs IN the cluster and reads through the API, which is why it needed the infra-observability
# ServiceAccount. Granted by the owner 2026-08-23.
ksm_version: v2.15.0
ksm_namespace: monitoring
ksm_service_account: observability
ksm_image: "registry.k8s.io/kube-state-metrics/kube-state-metrics:{{ ksm_version }}"

# A fixed NodePort so the collector can scrape it from the host without holding a kubeconfig. See
# tasks/main.yml for why that indirection is the point rather than a workaround.
ksm_node_port: 30080

# Deliberately narrower than the grant allows. The policy permits reading anything cluster-wide;
# this asks for the objects the dashboards actually plot, because a permission that is not used is
# a permission that cannot be misused. Adding a resource here means adding it to the ClusterRole in
# the template too -- they are kept adjacent for exactly that reason.
ksm_resources:
  - nodes
  - pods
  - namespaces
  - deployments
  - statefulsets
  - daemonsets
  - jobs
  - persistentvolumeclaims
  # Added 2026-09-27 so platform-healthy can read the IngressClass and every Ingress host from
  # Grafana rather than over SSH (infra-objectives CLAUDE.md, "Unattended checks never use SSH").
  - ingresses
  - ingressclasses

# Object labels KSM exports as `kube_<kind>_labels`. Only these two, and only because
# platform-healthy compares them with the pins in helm-override-files: the Traefik chart version and
# the cert-manager version.
ksm_metric_labels_allowlist: "daemonsets=[helm.sh/chart],deployments=[app.kubernetes.io/version]"

# Custom-resource metrics for the three kinds platform-healthy grades — each exported as
# kube_customresource_<name>. Conditions become one series per condition type (1 = True, 0 = False);
# notAfter and renewalTime are RFC3339 strings, which KSM turns into Unix timestamps. Read-only on all
# three; nothing here touches a Secret (the DopplerSecret predicate was amended for that reason).
ksm_custom_resource_state:
  kind: CustomResourceStateMetrics
  spec:
    resources:
      - groupVersionKind: {group: cert-manager.io, version: v1, kind: Certificate}
        labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
        metrics:
          - name: certificate_condition
            help: "cert-manager Certificate status conditions (1 = True)"
            each:
              type: Gauge
              gauge: {path: [status, conditions], labelsFromPath: {type: [type]}, valueFrom: [status]}
          - name: certificate_not_after
            help: "cert-manager Certificate expiry (status.notAfter) as a Unix timestamp"
            each:
              type: Gauge
              gauge: {path: [status], valueFrom: [notAfter]}
          - name: certificate_renewal_time
            help: "cert-manager Certificate renewal time (status.renewalTime) as a Unix timestamp"
            each:
              type: Gauge
              gauge: {path: [status], valueFrom: [renewalTime]}
      - groupVersionKind: {group: cert-manager.io, version: v1, kind: ClusterIssuer}
        labelsFromPath: {name: [metadata, name]}
        metrics:
          - name: clusterissuer_condition
            help: "cert-manager ClusterIssuer status conditions (1 = True)"
            each:
              type: Gauge
              gauge: {path: [status, conditions], labelsFromPath: {type: [type]}, valueFrom: [status]}
      - groupVersionKind: {group: secrets.doppler.com, version: v1alpha1, kind: DopplerSecret}
        labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
        metrics:
          - name: dopplersecret_condition
            help: "Doppler operator DopplerSecret status conditions (1 = True)"
            each:
              type: Gauge
              gauge: {path: [status, conditions], labelsFromPath: {type: [type]}, valueFrom: [status]}
