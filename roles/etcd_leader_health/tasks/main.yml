---
# Installs etcd-leader-health on one etcd member: the script, its settings, a oneshot service and a
# minute timer. See files/etcd-leader-health.py for what it does and why; README.md for operating it.

- name: Refuse a cluster with fewer than three etcd members
  # One member has nothing to move leadership to, and two cannot lose one and keep quorum. The
  # script would only log; installing it there would look like protection that does not exist.
  ansible.builtin.assert:
    that: (groups['etcd'] | default([]) | length) >= 3
    fail_msg: "etcd group has {{ groups['etcd'] | default([]) | length }} member(s); leader transfer needs at least 3"
  run_once: true

- name: Confirm etcdctl and this host's admin certificate exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/etcdctl
    - "/etc/ssl/etcd/ssl/admin-{{ inventory_hostname }}.pem"
    - "/etc/ssl/etcd/ssl/admin-{{ inventory_hostname }}-key.pem"
  register: etcd_leader_health_prereq
  failed_when: not etcd_leader_health_prereq.stat.exists

- name: Install the script
  ansible.builtin.copy:
    src: etcd-leader-health.py
    dest: /usr/local/bin/etcd-leader-health.py
    mode: "0755"

- name: Write its settings
  ansible.builtin.template:
    src: etcd-leader-health.env.j2
    dest: /etc/etcd-leader-health.env
    mode: "0644"

- name: Install the service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - etcd-leader-health.service
    - etcd-leader-health.timer
  notify: Reload systemd for etcd-leader-health

- name: Apply the systemd reload now, before the timer starts
  ansible.builtin.meta: flush_handlers

# The three tasks below need the unit files to exist, which check mode never writes on a first
# install — so in check mode they are skipped rather than failed (the first-install case in
# infra-objectives CLAUDE.md, "A first install cannot be fully planned").
- name: Start the minute timer
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: etcd-leader-health.timer
    enabled: true
    state: started

# Graded on the installed thing, not on the tasks above: run once and read what it printed.
- name: Run it once now
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: etcd-leader-health.service
    state: started
  changed_when: false

- name: Read the run's journal line
  when: not ansible_check_mode
  # -t (the script's SyslogIdentifier), not -u: the unit's journal ends with systemd's own
  # "Deactivated successfully" / "Finished ..." lines, which are not the script's output.
  ansible.builtin.command: journalctl -t etcd-leader-health -n 1 -o cat --no-pager
  register: etcd_leader_health_last
  changed_when: false
  check_mode: false   # a read

- name: Confirm it read the cluster
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - etcd_leader_health_last.stdout | length > 0
      - (etcd_leader_health_last.stdout | from_json).leader is defined
      - (etcd_leader_health_last.stdout | from_json).local is not none
      - (etcd_leader_health_last.stdout | from_json).armed == (etcd_leader_health_armed | bool)
    fail_msg: "etcd-leader-health did not read the cluster: {{ etcd_leader_health_last.stdout }}"
    success_msg: "{{ (etcd_leader_health_last.stdout | from_json) | dict2items | selectattr('key', 'in', ['host', 'armed', 'leader', 'local', 'action', 'reason']) | items2dict }}"
