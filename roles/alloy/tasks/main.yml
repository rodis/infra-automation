---

  # Fail loudly and early rather than installing a collector that silently ships nowhere. A
  # misnamed context variable is the likeliest failure here, and an Alloy that starts, runs, and
  # writes to an empty URL looks healthy from every angle except the one that matters.
  - name: Check the remote_write settings were supplied
    ansible.builtin.assert:
      that:
        - alloy_remote_write_url | length > 0
        - alloy_remote_write_user | length > 0
        - alloy_remote_write_token | length > 0
      fail_msg: >-
        GRAFANA_REMOTE_WRITE_URL, _USER and _TOKEN must all be set. They come from the Spacelift
        `Observability` context — check the variable NAMES if the context is attached but this
        still fails.
      success_msg: "remote_write settings present"
    run_once: true

  - name: Check the log shipping settings were supplied
    ansible.builtin.assert:
      that:
        - alloy_loki_url | length > 0
        - alloy_loki_user | length > 0
        - alloy_loki_token | length > 0
      fail_msg: >-
        alloy_ship_logs is true but the Loki settings are missing. GRAFANA_LOKI_URL and
        GRAFANA_LOKI_USER go in the `Observability` context — note the Loki instance id is a
        DIFFERENT number from the Prometheus one. The token falls back to
        GRAFANA_REMOTE_WRITE_TOKEN, which only works if that access policy carries logs:write as
        well as metrics:write; otherwise set GRAFANA_LOKI_TOKEN.
      success_msg: "log shipping settings present"
    run_once: true
    when: alloy_ship_logs | bool

  - name: Check the AWX scrape settings were supplied
    ansible.builtin.assert:
      that:
        - alloy_awx_url | length > 0
        - alloy_awx_token | length > 0
      fail_msg: >-
        ALLOY_SCRAPE_AWX is true but AWX_METRICS_URL or AWX_METRICS_TOKEN is missing. Both are
        stack-level variables on the PostgreSQL observability stack — deliberately not in the
        shared Observability context, which autoattaches everywhere and would put an AWX token in
        every run in the estate.
      success_msg: "AWX scrape settings present"
    run_once: true
    when: alloy_scrape_awx | bool

  # Mimir rejects out-of-order samples, so a host whose clock has drifted does not degrade
  # gracefully — it gets 400s from every write. Cheaper to guarantee time sync than to debug it
  # later from the receiving end.
  - name: Ensure the clock is disciplined
    ansible.builtin.package:
      name: systemd-timesyncd
      state: present

  - name: Start and enable time synchronisation
    ansible.builtin.systemd:
      name: systemd-timesyncd
      state: started
      enabled: true

  - name: Install the prerequisites for Grafana's apt repository
    ansible.builtin.apt:
      name:
        - apt-transport-https
        - gpg
      state: present
      update_cache: true
      cache_valid_time: 3600

  # /etc/apt/keyrings is not present on every Debian release that might be under us.
  - name: Ensure the keyring directory exists
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

  - name: Add Grafana's signing key
    ansible.builtin.get_url:
      url: https://apt.grafana.com/gpg.key
      dest: /etc/apt/keyrings/grafana.asc
      mode: "0644"

  # Written directly rather than with ansible.builtin.apt_repository, which is deprecated and
  # removed in ansible-core 2.25. Its replacement, deb822_repository, needs 2.15+ — and the
  # version of Ansible in the Spacelift runner is not something this playbook should have an
  # opinion about. A source file is a source file on every version.
  - name: Add the Grafana apt repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/grafana.list
      content: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main\n"
      owner: root
      group: root
      mode: "0644"
    register: alloy_repo

  - name: Refresh the package lists if the repository changed
    ansible.builtin.apt:
      update_cache: true
    when: alloy_repo is changed

  - name: Install Alloy
    ansible.builtin.apt:
      name: alloy
      state: present

  # Without this Alloy reads NOTHING from the journal and says nothing about it: the service stays
  # active, metrics keep flowing, and logs simply never appear. Green everywhere and quietly
  # incomplete is the worst shape of failure available, so it is a task rather than a README note.
  # Group membership only takes effect on restart, hence the notify.
  - name: Let Alloy read the systemd journal
    ansible.builtin.user:
      name: alloy
      groups: systemd-journal
      append: true
    when: alloy_ship_logs | bool
    notify: Restart alloy

  # Ask the host what is listening rather than assuming a distribution's defaults. south is not
  # kubespray, so "kubeadm puts etcd metrics on 2381" is a guess; this turns it into a fact, and
  # the config below scrapes only what actually answered.
  - name: Look for unauthenticated Kubernetes endpoints on this host
    ansible.builtin.uri:
      url: "{{ item.url }}"
      method: GET
      validate_certs: false
      status_code: [200]
      timeout: 5
    loop:
      - { name: etcd, url: "http://127.0.0.1:2381/metrics" }
      - { name: apiserver, url: "https://127.0.0.1:6443/healthz" }
    loop_control:
      label: "{{ item.name }}"
    register: alloy_k8s_probe
    failed_when: false
    changed_when: false
    # Reads. They must run in check mode, or the set_fact below is undefined and the template
    # renders without the blocks it is supposed to decide on.
    check_mode: false
    when: alloy_probe_kubernetes | bool

  - name: Record which of them answered
    ansible.builtin.set_fact:
      alloy_has_etcd: "{{ (alloy_k8s_probe.results | default([]) | selectattr('item.name', 'equalto', 'etcd') | map(attribute='status') | first | default(0)) == 200 }}"
      alloy_has_apiserver: "{{ (alloy_k8s_probe.results | default([]) | selectattr('item.name', 'equalto', 'apiserver') | map(attribute='status') | first | default(0)) == 200 }}"
    when: alloy_probe_kubernetes | bool

  - name: Report what was found
    ansible.builtin.debug:
      msg: >-
        {{ inventory_hostname }}: etcd metrics {{ 'YES' if alloy_has_etcd | default(false) else 'no' }},
        apiserver healthz {{ 'YES' if alloy_has_apiserver | default(false) else 'no' }}
    when: alloy_probe_kubernetes | bool

  # PostgreSQL, found the same way as the endpoints above: by asking the host. A socket present
  # means a server is running here; its absence means this is a cluster node and the block below
  # renders to nothing.
  - name: Look for a local PostgreSQL socket
    ansible.builtin.stat:
      path: "{{ alloy_postgres_socket_dir }}/.s.PGSQL.5432"
    register: alloy_pg_socket
    changed_when: false
    when: alloy_scrape_postgres | bool

  - name: Record whether PostgreSQL is here
    ansible.builtin.set_fact:
      alloy_has_postgres: "{{ alloy_pg_socket.stat.exists | default(false) | bool }}"
    when: alloy_scrape_postgres | bool

  - name: Report whether PostgreSQL was found
    ansible.builtin.debug:
      msg: "{{ inventory_hostname }}: PostgreSQL {{ 'YES' if alloy_has_postgres | default(false) else 'no' }}"
    when: alloy_scrape_postgres | bool

  # Look first, then create — the same shape as the Grafana folder, and for the same reason: the
  # error returned by "create something that exists" is a moving target, while a lookup is not.
  - name: Does the monitoring role already exist?
    become_user: postgres
    ansible.builtin.command:
      argv:
        - psql
        - -tAc
        - "select 1 from pg_roles where rolname = '{{ alloy_postgres_role }}'"
    register: alloy_pg_role_check
    changed_when: false
    check_mode: false   # a read; the CREATE below is a write and stays skipped in check mode
    when: alloy_has_postgres | default(false)

  - name: Create the read-only monitoring role
    become_user: postgres
    ansible.builtin.command:
      argv:
        - psql
        - -v
        - ON_ERROR_STOP=1
        - -c
        - "CREATE ROLE {{ alloy_postgres_role }} LOGIN"
    when:
      - alloy_has_postgres | default(false)
      - (alloy_pg_role_check.stdout | default('') | trim) != '1'

  # pg_monitor is PostgreSQL's own read-only monitoring role. Granting it is idempotent, so this
  # runs every time rather than only on creation — which also repairs a role that exists but lost
  # the grant, a state that would otherwise produce a permanently broken exporter and no clue why.
  - name: Grant pg_monitor to the monitoring role
    become_user: postgres
    ansible.builtin.command:
      argv:
        - psql
        - -v
        - ON_ERROR_STOP=1
        - -c
        - "GRANT pg_monitor TO {{ alloy_postgres_role }}"
    changed_when: false
    when: alloy_has_postgres | default(false)

  # kube-state-metrics. Two conditions, and both are needed: the port answers on EVERY node
  # because it is a NodePort, so probing alone would enable this scrape three times over.
  - name: Am I the control plane?
    ansible.builtin.stat:
      path: /etc/kubernetes/admin.conf
    register: alloy_admin_conf
    changed_when: false
    check_mode: false
    when: alloy_scrape_kube_state_metrics | bool

  - name: Look for kube-state-metrics on the NodePort
    ansible.builtin.uri:
      url: "http://127.0.0.1:{{ alloy_ksm_port }}/metrics"
      status_code: [200]
      timeout: 5
    register: alloy_ksm_probe
    failed_when: false
    changed_when: false
    check_mode: false
    when:
      - alloy_scrape_kube_state_metrics | bool
      - alloy_admin_conf.stat.exists | default(false)

  - name: Record whether to scrape it here
    ansible.builtin.set_fact:
      alloy_has_ksm: "{{ (alloy_ksm_probe.status | default(0)) == 200 }}"
    when: alloy_scrape_kube_state_metrics | bool

  - name: Report
    ansible.builtin.debug:
      msg: >-
        {{ inventory_hostname }}: kube-state-metrics
        {{ 'YES (scraping here)' if alloy_has_ksm | default(false) else 'no' }}
    when: alloy_scrape_kube_state_metrics | bool

  # Pod logs. Same discovery principle as everything else here: ask the host.
  - name: Look for a kubelet pod log directory
    ansible.builtin.stat:
      path: /var/log/pods
    register: alloy_pod_log_dir
    changed_when: false
    check_mode: false
    when: alloy_ship_pod_logs | bool

  - name: Record whether this host has pod logs
    ansible.builtin.set_fact:
      alloy_has_pod_logs: "{{ alloy_pod_log_dir.stat.isdir | default(false) | bool }}"
    when: alloy_ship_pod_logs | bool

  - name: Install acl
    ansible.builtin.apt:
      name: acl
      state: present
      update_cache: true
      cache_valid_time: 3600
    when: alloy_has_pod_logs | default(false)

  - name: Read the current ACL on the pod log tree
    ansible.builtin.command:
      argv: [getfacl, -p, /var/log/pods]
    register: alloy_pod_getfacl
    changed_when: false
    failed_when: false
    check_mode: false
    when: alloy_has_pod_logs | default(false)

  # /var/log/pods is 750 root:root with 640 files, so the alloy user cannot even traverse it. The
  # alternative -- adding alloy to group root -- would hand a collector read access to every
  # root:root 0640 file on the machine, which is a far larger grant than "read the container logs".
  #
  # The DEFAULT entry is the load-bearing half. kubelet creates a fresh directory per pod, and only
  # a default ACL is inherited by directories created later; without it this works today and
  # silently stops covering anything scheduled tomorrow.
  - name: Grant the collector read access to pod logs
    ansible.builtin.command:
      argv: [setfacl, -R, -m, "u:alloy:rX", -m, "d:u:alloy:rX", /var/log/pods]
    when:
      - alloy_has_pod_logs | default(false)
      - "'default:user:alloy:r-x' not in (alloy_pod_getfacl.stdout | default(''))"

  - name: Write the candidate Alloy configuration
    ansible.builtin.template:
      src: config.alloy.j2
      dest: /etc/alloy/config.alloy.candidate
      owner: root
      group: alloy
      # root:alloy 0640 — the file holds the remote_write token, so it must not be world
      # readable, but the unit is `User=alloy` and reads the config as that user from the start.
      # This was root:root on the first attempt, on the mistaken belief that Alloy started as
      # root and dropped privileges. It does not, and the service crash-looped on
      # "reading config path: permission denied" until systemd gave up.
      mode: "0640"
    # Deliberately runs in check mode too. The candidate is NOT the live config, so writing it
    # changes nothing that matters -- and it lets `alloy validate` below actually run, which turns
    # a plan into a genuine test that the config parses, rather than a note that a file would change.
    check_mode: false

  # Validate BEFORE the live file is touched. On 2026-08-23 a metric_relabel_config block that is
  # valid Prometheus YAML but not valid Alloy syntax made the config unparseable, Alloy refused to
  # start, and the host stopped shipping EVERYTHING — metrics and logs — until it was found. The
  # candidate file makes a bad config a failed task instead of a dark host.
  - name: Validate the candidate configuration
    ansible.builtin.command:
      argv: [alloy, validate, /etc/alloy/config.alloy.candidate]
    register: alloy_validate
    changed_when: false
    failed_when: alloy_validate.rc != 0
    check_mode: false

  - name: Install the validated configuration
    ansible.builtin.copy:
      src: /etc/alloy/config.alloy.candidate
      dest: /etc/alloy/config.alloy
      remote_src: true
      owner: root
      group: alloy
      mode: "0640"
    notify: Restart alloy

  - name: Remove the candidate
    ansible.builtin.file:
      path: /etc/alloy/config.alloy.candidate
      state: absent
    changed_when: false
    check_mode: false   # clean up the candidate we deliberately wrote above


  - name: Clear any previous failed state before starting
    ansible.builtin.systemd:
      name: alloy
      state: stopped
    failed_when: false
    changed_when: false

  - name: Reset the systemd start-rate limiter
    ansible.builtin.command: systemctl reset-failed alloy
    failed_when: false
    changed_when: false

  - name: Start and enable Alloy
    ansible.builtin.systemd:
      name: alloy
      state: started
      enabled: true
      daemon_reload: true

  - name: Flush handlers so the verification below tests the new config
    ansible.builtin.meta: flush_handlers

  # A running service is not a shipping service. Alloy starts happily with a config that writes
  # to an endpoint refusing every sample, so check what it says about itself rather than whether
  # systemd is content.
  - name: Give Alloy a moment to attempt its first write
    ansible.builtin.wait_for:
      timeout: 20
    delegate_to: localhost
    become: false
    run_once: true

  - name: Read Alloy's own view of its health
    ansible.builtin.command: systemctl is-active alloy
    changed_when: false
    # `systemctl is-active` exits non-zero exactly when the answer is interesting, and `command`
    # treats that as a task failure — so the first run aborted here instead of printing the
    # journal that said why. A check that cannot report a bad result is not a check.
    failed_when: false
    register: alloy_active
    check_mode: false

  # Ask Alloy what it actually shipped, rather than grepping its logs. The first version of this
  # searched the journal for /error/ and matched `level=info msg="node exited without error"` — a
  # SUCCESS message containing the word. It failed a run in which everything had worked, which is
  # the same class of mistake as reading a check's failure as the thing being checked.
  #
  # These two counters are the ground truth: samples handed to remote_write, and samples the
  # endpoint rejected.
  - name: Read Alloy's own shipping counters
    ansible.builtin.shell:
      cmd: >-
        set -o pipefail;
        curl -s --max-time 10 localhost:12345/metrics
        | awk '/^prometheus_remote_storage_samples_total/ {s=$NF}
               /^prometheus_remote_storage_samples_failed_total/ {f=$NF}
               /^loki_write_sent_entries_total/ {le+=$NF}
               /^loki_write_dropped_entries_total/ {ld+=$NF}
               END {printf "%d %d %d %d", s+0, f+0, le+0, ld+0}'
      executable: /bin/bash
    changed_when: false
    failed_when: false
    register: alloy_counters
    check_mode: false
    # The first scrape has to happen before there is anything to count.
    retries: 6
    delay: 15
    until: >-
      (alloy_counters.stdout.split()[0] | default(0) | int) > 0
      and (not (alloy_ship_logs | bool)
           or (alloy_counters.stdout.split()[2] | default(0) | int) > 0)

  - name: Report
    ansible.builtin.debug:
      msg: >-
        {{ inventory_hostname }}: alloy {{ alloy_active.stdout }},
        metrics {{ alloy_counters.stdout.split()[0] | default('0') }} sent /
        {{ alloy_counters.stdout.split()[1] | default('?') }} rejected,
        logs {{ alloy_counters.stdout.split()[2] | default('0') }} sent /
        {{ alloy_counters.stdout.split()[3] | default('?') }} dropped

  - name: Check Alloy is running and its samples are being accepted
    ansible.builtin.assert:
      that:
        - alloy_active.stdout == 'active'
        - (alloy_counters.stdout.split()[0] | default(0) | int) > 0
        - (alloy_counters.stdout.split()[1] | default(1) | int) == 0
        # A silent zero here is the journal-group permission, not a quiet machine: even an idle
        # host logs something within a minute.
        - not (alloy_ship_logs | bool) or (alloy_counters.stdout.split()[2] | default(0) | int) > 0
        - (alloy_counters.stdout.split()[3] | default(0) | int) == 0
      fail_msg: >-
        Alloy is not shipping cleanly on {{ inventory_hostname }} — service is
        '{{ alloy_active.stdout }}', {{ alloy_counters.stdout | default('no counters') }}
        (samples sent / rejected). Rejections mean the endpoint refused them: a 401 or 403 is the
        token or instance id, a 400 mentioning out-of-order samples is the clock. Zero sent with
        the service active means nothing is being scraped — check the exporter block.
      success_msg: >-
        {{ inventory_hostname }} is shipping metrics and none are being rejected.
