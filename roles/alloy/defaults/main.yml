---
# METRICS. Supplied by the Spacelift `Observability` context; only the token is secret.
alloy_remote_write_url: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_URL') }}"
alloy_remote_write_user: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_USER') }}"
alloy_remote_write_token: "{{ lookup('env', 'GRAFANA_REMOTE_WRITE_TOKEN') }}"
alloy_scrape_interval: 60s

# LOGS. Loki is a different endpoint with a different instance id from Prometheus — same stack,
# separate tenants. The token is shared only if the access policy behind it carries logs:write as
# well as metrics:write; GRAFANA_LOKI_TOKEN overrides when they are separate policies.
alloy_ship_logs: true
alloy_loki_url: "{{ lookup('env', 'GRAFANA_LOKI_URL') }}"
alloy_loki_user: "{{ lookup('env', 'GRAFANA_LOKI_USER') }}"
alloy_loki_token: "{{ lookup('env', 'GRAFANA_LOKI_TOKEN') or lookup('env', 'GRAFANA_REMOTE_WRITE_TOKEN') }}"

# How far back to read on first start. This matters more than it looks: the PostgreSQL VM has been
# up 20 weeks, and without a bound Alloy would ship its entire historical journal on the first run
# and spend a large part of the 50GB allowance recovering history nobody asked for.
alloy_journal_max_age: "12h"

# AWX (level 3). Off by default and enabled on exactly ONE host, because every host that scrapes
# would produce a duplicate copy of the same series. It is enabled on the PostgreSQL VM rather than
# a cluster node on purpose: AWX runs in that Kubernetes cluster, so a node scraping it would go
# dark for the same reason AWX did, turning an outage into missing data. From outside the cluster
# the same outage reads as up{job="awx"} == 0, which is a fact rather than a silence.
alloy_scrape_awx: "{{ (lookup('env', 'ALLOY_SCRAPE_AWX') | default('false', true)) | bool }}"
alloy_awx_url: "{{ lookup('env', 'AWX_METRICS_URL') }}"
alloy_awx_token: "{{ lookup('env', 'AWX_METRICS_TOKEN') }}"

# KUBERNETES (level 2). Discovered rather than declared: the role probes each host for endpoints
# that are reachable WITHOUT credentials, and scrapes whatever answers. south is not a kubespray
# cluster, so assuming kubeadm's defaults would be a guess; asking the host is not.
#
# What this can and cannot reach, and why:
#   etcd  127.0.0.1:2381/metrics   — no auth by default, control-plane only         -> scraped
#   API   127.0.0.1:6443/healthz   — anonymous access is normally permitted          -> scraped
#   kubelet   :10250, apiserver /metrics, controller-manager, scheduler              -> need a
#     bearer token, which means an in-cluster ServiceAccount, which is the
#     infra-observability grant that is DESIGNED BUT NOT GRANTED. Not attempted here.
#   kube-state-metrics — object state (pod phases, deployment replicas) — must run IN the cluster.
alloy_probe_kubernetes: true

# POSTGRESQL. Discovered rather than declared, like the Kubernetes endpoints above: the role looks
# for a local PostgreSQL socket and configures the exporter only where one exists, so the same role
# runs unchanged on the database VM and on the cluster nodes.
#
# Authentication is peer over the unix socket, so THERE IS NO PASSWORD ANYWHERE. Debian's pg_hba
# already carries `local all all peer`, which means a PostgreSQL role whose name matches the OS
# user Alloy runs as authenticates with no secret: nothing to store in a vault, nothing to rotate,
# and nothing that can be printed into a run log. `pg_monitor` is PostgreSQL's own built-in
# read-only monitoring role — it grants the pg_stat_* views and settings, and no ability to read
# table data or write anything at all.
alloy_scrape_postgres: true
alloy_postgres_role: alloy
alloy_postgres_socket_dir: /var/run/postgresql

# POSTGRESQL LOGS. Separate from the journal on purpose: PostgreSQL here runs with
# logging_collector=off and log_destination=stderr, which on Debian lands in a FILE
# (/var/log/postgresql/postgresql-15-main.log) while journald gets only systemd lifecycle lines.
# So the journal shows "Started postgresql@15-main" and nothing else -- and on 2026-08-23 a Loki
# search for the connection refusals that were breaking AWX returned nothing while 1,280 of them
# sat in that file, the earliest at 10:28 UTC, hours before anyone noticed.
#
# No permission change is needed: the file is postgres:adm 0640 and the alloy package already puts
# its user in `adm`.
alloy_ship_postgres_logs: true
alloy_postgres_log_glob: /var/log/postgresql/postgresql-*-main.log

# POD LOGS. Scoped by namespace rather than shipped wholesale, because the free tier is 50GB/month
# and the useful fraction is small. Measured on 2026-08-23 (60s sample, quiet):
#   kube-system 8.9 MB/day | awx 3.8 | kube-flannel ~0 | nginx-ingress 3.1 | doppler 6.6
# The selected set is ~13 MB/day, about 400MB/month. cert-manager and nginx-ingress are excluded
# deliberately (owner's call); add a glob here rather than widening to a catch-all.
#
# /var/log/pods is 750 root:root with 640 files, so the alloy user cannot traverse it. Rather than
# put a service account in group root -- which would grant it every root:root 0640 file on the box
# -- the role installs `acl` and sets a DEFAULT acl, which kubelet's newly created pod directories
# inherit.
alloy_ship_pod_logs: true
alloy_pod_log_namespaces:
  - awx
  - kube-system
  - kube-flannel
